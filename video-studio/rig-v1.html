<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 허공장 리깅 엔진 v1</title>
<style>body{font-family:system-ui;background:#101723;color:#eee;max-width:1050px;margin:auto;padding:18px}canvas{width:min(100%,360px);aspect-ratio:9/16;background:#202838;border-radius:12px}button,input{margin:5px;padding:8px}button{cursor:pointer}.wrap{display:flex;flex-wrap:wrap;gap:22px}.controls{max-width:460px}label{display:block;margin:10px 0}small{color:#b8c8db}</style>
<h2>AI 허공장 · 독립 리깅 실험 v1</h2><p>원본 픽셀을 늘리지 않는 캔버스 기반 얼굴·눈·입·의상 애니메이션 실험입니다.</p><div class="wrap"><canvas id="scene" width="1080" height="1920"></canvas><section class="controls"><label>원본 이미지 선택 <input id="file" type="file" accept="image/*"></label><label>눈 감기 <input id="blink" type="range" min="0" max="100" value="0"></label><label>입 벌리기 <input id="mouth" type="range" min="0" max="100" value="0"></label><label>바람 <input id="wind" type="range" min="0" max="100" value="20"></label><label>대사 <input id="speech" value="안녕하세요. AI 허공장입니다." style="width:95%"></label><button id="talk">한국어 음성 테스트</button><button id="record">10초 녹화(WebM)</button><p id="status">이미지를 선택해 주세요.</p><small>시범 좌표는 제공된 허공장 초상(941×1672)에 맞춰져 있습니다. 눈꺼풀·입은 기하학적 합성으로 실제 얼굴 리깅의 품질에는 미치지 못합니다. 브라우저 음성은 시스템 한국어 TTS를 사용하며 녹화 파일에 음성이 포함되지 않을 수 있습니다.</small></section></div>
<script>
const c=document.querySelector('#scene'),ctx=c.getContext('2d'),W=1080,H=1920;let img=null,elapsed=0,recording=false;
const $=s=>document.querySelector(s);const blink=$('#blink'),mouth=$('#mouth'),wind=$('#wind');
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(u);$('#status').textContent='원본 로드 완료 · 얼굴/눈/입 좌표는 초상 기준';};im.src=u;};
function draw(t){ctx.clearRect(0,0,W,H);if(!img){ctx.fillStyle='#1e2a3a';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='48px system-ui';ctx.fillText('원본 사진을 업로드하세요',100,800);return;}
const sw=img.width,sh=img.height,scale=Math.max(W/sw,H/sh),dw=sw*scale,dh=sh*scale,ox=(W-dw)/2,oy=(H-dh)/2;ctx.drawImage(img,ox,oy,dw,dh);
const px=x=>ox+x*dw/941,py=y=>oy+y*dh/1672,sx=dw/941,sy=dh/1672;
let b=+blink.value/100;if(recording){const times=[1.8,4.7,7.6];b=Math.max(b,...times.map(a=>Math.exp(-Math.pow((t-a)/0.12,4))));}
const skin='#e8b9a4';if(b>0.005){for(const [ex,ey] of [[430,449],[548,434]]){ctx.save();ctx.beginPath();ctx.ellipse(px(ex),py(ey),px(36)-px(0),py(21)-py(0),-0.10,0,Math.PI*2);ctx.clip();ctx.fillStyle=skin;ctx.globalAlpha=Math.min(0.98,b);ctx.fillRect(px(ex-45),py(ey-22),90*sx,45*sy);ctx.globalAlpha=1;ctx.strokeStyle='#68433e';ctx.lineWidth=3*sy;ctx.beginPath();ctx.moveTo(px(ex-30),py(ey+3));ctx.quadraticCurveTo(px(ex),py(ey+9*b),px(ex+30),py(ey+1));ctx.stroke();ctx.restore();}}
let m=+mouth.value/100;if(recording)m=Math.max(m,0.28*(0.5+0.5*Math.sin(t*11)));if(m>0.02){ctx.save();ctx.beginPath();ctx.ellipse(px(515),py(577),px(39)-px(0),Math.max(2,py(19*m)-py(0)),0,0,Math.PI*2);ctx.fillStyle='#5c1c2b';ctx.fill();ctx.strokeStyle='#b66d78';ctx.lineWidth=2*sy;ctx.stroke();ctx.restore();}
const breeze=(+wind.value/100)*Math.sin(t*1.9);ctx.globalAlpha=.5;ctx.strokeStyle='#a46f4d';ctx.lineWidth=2*sx;for(let k=0;k<4;k++){ctx.beginPath();const x=706+k*10,y=450+k*35;ctx.moveTo(px(x),py(y));ctx.quadraticCurveTo(px(x+35+breeze*10),py(y+70),px(x+40+breeze*22),py(y+125));ctx.stroke();}ctx.globalAlpha=1;
}
function frame(ts){elapsed=ts/1000;draw(elapsed);requestAnimationFrame(frame);}requestAnimationFrame(frame);
$('#talk').onclick=()=>{if(!('speechSynthesis'in window)){alert('이 브라우저는 음성을 지원하지 않습니다.');return;}const u=new SpeechSynthesisUtterance($('#speech').value);u.lang='ko-KR';u.rate=.88;speechSynthesis.speak(u);};
$('#record').onclick=async()=>{if(!img){alert('먼저 이미지를 올려 주세요.');return;}if(!c.captureStream||!window.MediaRecorder){alert('이 브라우저는 녹화를 지원하지 않습니다.');return;}const stream=c.captureStream(30),parts=[],mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000});r.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};r.onstop=()=>{const url=URL.createObjectURL(new Blob(parts,{type:mime}));const a=document.createElement('a');a.href=url;a.download='AI_Heogongjang_Rig_10s_FHD.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('#status').textContent='10초 영상 저장 완료 (WebM)';recording=false;};recording=true;$('#status').textContent='녹화 중 (10초)';r.start();setTimeout(()=>r.stop(),10000);};
</script></html>
