<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기도 공간 | NOW Mind Search</title>
  <style>
    body { margin: 0; background: #fcedf0; color: #263d36; font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: auto; padding: 40px 20px; }
    a { color: #355a48; }
    .interior:not([hidden]) {
      display: grid;
      grid-template-rows: 60% auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      max-width: none;
      padding: 0;
    }
    .interior section { display: grid; place-items: center; }
    .foreground { position: relative; min-height: 0; }
    .interior h2 { margin: 0; font-size: clamp(24px, 6vw, 36px); }
    .interior .seating { min-height: 0; border-top: 1px solid #b8949f; background: #f5e8d5; }
    .space-gallery {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2f2118;
    }
    .space-gallery img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .space-gallery button {
      position: absolute;
      left: 12px;
      bottom: 12px;
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #fff9;
      border-radius: 22px;
      background: #21160de0;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .space-gallery button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .interior .furnished-seating {
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .home-return {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      box-sizing: border-box;
      margin: 6px 12px max(8px, env(safe-area-inset-bottom));
      padding: 6px 14px;
      border-radius: 22px;
      background: #355a48;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .home-return:focus-visible { outline: 2px solid #263d36; outline-offset: 2px; }
    .interior .church-seating {
      background: #ecdbba url("./assets/church/marble-floor.webp") center / 360px 360px repeat;
    }
    .interior .cathedral-seating {
      background: #ecdbba url("./assets/church/marble-floor.webp") center / 360px 360px repeat;
    }
    .cathedral-seating .paired-aisle {
      background: #641b29 url("./assets/cathedral/runner.webp") center / 100% 100% no-repeat;
      box-shadow: 0 1px 4px #37130e50;
    }
    .upholstered-chair {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      transform: rotate(180deg);
    }
    @media (max-height: 600px) and (orientation: landscape) {
      .interior:not([hidden]) { min-height: 620px; }
    }
    .temple-view {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #35231a;
    }
    .temple-view img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .temple-motion {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
    }
    .temple-motion :is(img, video), .foreground .chant-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .foreground .chant-video--full-frame {
      background: #21160d;
      object-fit: contain;
      object-position: center;
    }
    .sasi-book { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle at center,#5a3d27,#160f0b); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px; box-sizing: border-box; color: #fff4d8; }
    .sasi-book[hidden] { display: none; }
    .sasi-book-top,.sasi-book-actions { width: min(96vw,760px); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .sasi-book button { border:1px solid #d8bb86; border-radius:10px; background:#382719; color:#fff2d9; padding:9px 13px; font:inherit; cursor:pointer; }
    .sasi-book-sheet { position:relative; width:min(94vw,760px); height:min(66dvh,540px); min-height:260px; display:grid; grid-template-columns:1fr 1fr; perspective:1000px; filter:drop-shadow(0 14px 20px #0009); }
    .sasi-book-page { background:linear-gradient(100deg,#e9d7b5,#fff9e9 15%,#f4e7cf); color:#37291b; padding:clamp(12px,3vw,32px); overflow:auto; border:1px solid #cbb58e; box-sizing:border-box; }
    .sasi-book-page:first-child { border-radius:14px 0 0 14px; box-shadow:inset -12px 0 20px #5b3b1926; }
    .sasi-book-page:last-child { border-radius:0 14px 14px 0; box-shadow:inset 12px 0 20px #5b3b1926; }
    .sasi-book-page h3 { margin:0 0 16px; font-size:clamp(17px,2.6vw,25px); text-align:center; color:#704b27; }
    .sasi-book-page p { white-space:pre-line; font-size:clamp(14px,2.2vw,20px); line-height:1.85; text-align:center; }
    .sasi-book-sheet.turning .sasi-book-page:last-child { animation:sasi-flip .5s ease-in-out; transform-origin:left center; }
    @keyframes sasi-flip { 0%{transform:rotateY(0)} 50%{transform:rotateY(-40deg)} 100%{transform:rotateY(0)} }
    .sasi-book small { max-width:760px; text-align:center; color:#e7d4ae; }
    .sasi-youtube-audio { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; left:-10px; top:-10px; }
    @media(max-width:520px) { .sasi-book-sheet { height:65dvh; } .sasi-book-page { padding:12px 9px; } }
    .sasi-text-dialog { width: min(92vw, 680px); max-height: 82dvh; overflow: auto; border: 1px solid #a58b6e; border-radius: 16px; padding: 24px; background: #fffaf1; color: #263d36; line-height: 1.8; }
    .sasi-text-dialog::backdrop { background: rgba(0,0,0,.55); }
    .sasi-text-dialog h2 { font-size: 1.45rem; margin: 0 0 8px; }
    .sasi-text-dialog h3 { font-size: 1.05rem; margin: 18px 0 4px; }
    .sasi-text-dialog p { margin: 4px 0 12px; }
    .sasi-text-dialog .sasi-close { float: right; padding: 6px 12px; cursor: pointer; }
    .chant-youtube { width: min(90%, 560px); height: min(45%, 315px); border: 0; z-index: 2; }
    .hall-chant {
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: max-content;
      max-width: calc(100% - 24px);
      transform: translateX(-50%);
    }
    .chant-controls button {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #f2d49a;
      border-radius: 999px;
      background: #271a13ed;
      color: #fff5e2;
      font: inherit;
      cursor: pointer;
    }
    .chant-controls button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .interior .temple-seating {
      background:
        repeating-linear-gradient(90deg, #52301c22 0 1px, transparent 1px 66px),
        linear-gradient(135deg, #b98754, #7d4e2e);
    }
    .seating-plan {
      --aisle-width: 18%;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(var(--seat-rows), minmax(0, 1fr));
      gap: clamp(4px, 1dvh, 10px);
      width: min(100%, 520px);
      height: 100%;
      box-sizing: border-box;
      padding: clamp(8px, 1.8dvh, 16px) 0;
    }
    .paired-aisle {
      position: absolute;
      inset: 0 calc((100% - var(--aisle-width)) / 2);
    }
    .temple-seating .paired-aisle {
      background: #f6cf8833;
      border-inline: 1px solid #69432255;
    }
    .paired-row {
      display: grid;
      grid-template-columns: repeat(var(--seats-per-side), minmax(0, 1fr)) var(--aisle-width) repeat(var(--seats-per-side), minmax(0, 1fr));
      width: 100%;
      place-items: center;
      min-height: 0;
      container-type: size;
    }
    .paired-row > .first-seat-right { grid-column: calc(var(--seats-per-side) + 2); }
    .temple-cushion[type="button"], .chair-name-button { padding: 0; cursor: pointer; }
    .temple-cushion:disabled, .chair-name-button:disabled { cursor: default; opacity: 1; }
    .chair-name-button {
      min-height: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
    }
    .paired-row .chair-name-button .upholstered-chair {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      /* Compensate for the transparent side margins in both chair images. */
      transform: rotate(180deg) scaleX(1.48);
    }
    .temple-cushion, .chair-name-button {
      width: min(86%, 108px, 125cqh);
      aspect-ratio: 1.6;
      box-sizing: border-box;
    }
    .temple-cushion[aria-pressed="true"], .chair-name-button[aria-pressed="true"] { outline: 3px solid #ffe19a; outline-offset: 2px; }
    .temple-cushion:focus-visible, .chair-name-button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .temple-cushion {
      border: 1px solid #40281c;
      border-radius: 18%;
      background: var(--cushion-color);
      box-shadow: inset 0 0 0 2px #e5b07966, inset 0 4px 12px #fff2, 0 2px 3px #41241480;
    }
    .seat-guide {
      margin: 0;
      padding: 8px 12px;
      border-block: 1px solid #dbcdb7;
      background: #fff9ed;
      color: #30251b;
      text-align: center;
      font-size: clamp(12px, 3.5vw, 15px);
      line-height: 1.4;
    }
    .hall-chant {
      color: #fff5e2;
      font-size: 14px;
      text-align: center;
    }
    .space-gallery:not([hidden]) + .hall-chant { max-width: calc(100% - 144px); }
    @media (max-width: 360px) {
      .space-gallery button { bottom: 64px; }
      .space-gallery:not([hidden]) + .hall-chant { max-width: calc(100% - 24px); }
    }
    .chant-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    :is(.daeungjeon, .muryangsujeon) .chant-controls { flex-wrap: nowrap; }
    :is(.daeungjeon, .muryangsujeon) .chant-controls button { min-width: 0; }
    :is(.daeungjeon, .muryangsujeon) .chant-button-size { white-space: nowrap; }
    .gwaneumjeon .hall-chant { width: 360px; }
    .gwaneumjeon .chant-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .gwaneumjeon .chant-controls button { min-width: 0; }
    .gwaneumjeon .chant-button-size { white-space: nowrap; }
    .chant-controls button { position: relative; }
    .chant-button-size { visibility: hidden; }
    .chant-button-label {
      position: absolute;
      inset: 2px 3px;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1.1;
      text-align: center;
      word-break: keep-all;
      white-space: pre-line;
    }
    .chant-controls button[aria-pressed="true"] { background: #355a48; }
    .chapter-dialog {
      box-sizing: border-box;
      width: min(420px, calc(100% - 24px));
      padding: 18px;
      border: 1px solid #a67a48;
      border-radius: 16px;
      background: #fff8e8;
      color: #352319;
    }
    .chapter-dialog::backdrop { background: #21160db8; }
    .chapter-dialog h2 { margin: 0 0 16px; font-size: 20px; }
    .chapter-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .chapter-dialog button {
      min-height: 44px;
      padding: 4px;
      border: 1px solid #a67a48;
      border-radius: 8px;
      background: #fff1d3;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .chapter-dialog button[aria-pressed="true"], .chapter-dialog form button {
      background: #482f20;
      color: #fff1d3;
    }
    .chapter-dialog button:focus-visible { outline: 2px solid #6c492e; outline-offset: 2px; }
    .chapter-dialog form { display: flex; justify-content: flex-end; }
    .chapter-dialog form button { min-width: 64px; }
    .chapter-status { min-height: 1.4em; margin: 12px 0; }
    .chant-status:not(:empty) {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #271a13ed;
    }
    .temple-cushion[type="button"], .chair-name-button { position: relative; }
    /* 읏맨-궁서체 · OK금융그룹 */
    @font-face {
      font-family: "OKGUNG";
      src: url("./assets/fonts/OKGUNG.woff2") format("woff2");
      font-display: swap;
    }
    .seat-name-label {
      position: absolute;
      inset: 2px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      justify-items: center;
      overflow: hidden;
      pointer-events: none;
      font: 400 10px/1.08 "OKGUNG", Gungsuh, "궁서", serif;
    }
    .seat-name-line {
      width: max-content;
      white-space: nowrap;
      padding-inline: 2px;
      box-sizing: border-box;
      border-radius: 3px;
      background: #261b15ed;
      color: #fff;
    }
    .seat-entry-page { background: #fff9ed; }
    .cushion-dialog {
      box-sizing: border-box;
      position: fixed;
      inset: var(--form-viewport-top, 0px) 0 auto;
      margin: 0;
      width: 100%;
      max-width: none;
      height: var(--form-viewport-height, 100dvh);
      max-height: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      border: 0;
      background: #fff9ed;
      color: #30251b;
    }
    .cushion-dialog::backdrop { background: #fff9ed; }
    .cushion-dialog h2, .cushion-dialog form, .seat-entry-status { max-width: 480px; margin-inline: auto; }
    .cushion-dialog h2 { margin-block: 0 24px; font-size: clamp(24px, 6vw, 34px); }
    .cushion-dialog form:not([hidden]) { display: grid; gap: 12px; }
    .cushion-dialog input {
      box-sizing: border-box; width: 100%; min-height: 52px; padding: 10px 12px;
      border: 1px solid #89715b; border-radius: 8px; font: inherit; font-size: 18px;
    }
    .seat-entry-status { margin-block: 16px 0; }
    .cushion-year-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .cushion-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .cushion-actions button {
      min-height: 44px; padding: 6px 12px; border: 1px solid #355a48;
      border-radius: 10px; background: #fff9ed; color: #355a48; font: inherit;
    }
    .cushion-actions button[type="submit"] { background: #355a48; color: #fff; }
  </style>
  <script src="./ui-language.js?v=2"></script>
  <script src="./prayer-i18n.js?v=2"></script>
</head>
<body>
  <main id="space-intro">
    <h1 id="space-title">기도 공간</h1>
    <p id="space-status" hidden>이 공간은 준비 중이에요.</p>
    <a href="./prayer.html">공간 선택으로 돌아가기</a>
  </main>
  <main id="space-interior" class="interior" hidden>
    <section class="foreground" aria-label="전경">
      <h2 id="view-title">전경</h2>
      <div class="space-gallery" hidden>
        <button type="button">일시정지</button>
      </div>
      <div class="hall-chant" role="group" aria-label="정근" hidden>
        <div class="chant-controls"></div>
        <span class="chant-status" role="status"></span>
        <audio loop preload="none"></audio>
      </div>
    </section>
    <p class="seat-guide"><span class="seat-guide-item">의자</span>를 선택하시고 기도하시려는 분의 성함을 넣으세요.<br>
      최대 <span class="seat-capacity"></span>명까지 가능합니다.</p>
    <section class="seating" aria-label="좌석">
      <div class="seating-plan" role="group"></div>
      <a class="home-return" href="./prayer.html?v=shared-fixed-seats">기도공간으로 돌아가기</a>
    </section>
  </main>
  <dialog class="chapter-dialog" aria-labelledby="chapter-title">
    <h2 id="chapter-title"></h2>
    <div class="chapter-grid"></div>
    <p class="chapter-status" role="status"></p>
    <form method="dialog"><button type="submit"></button></form>
  </dialog>
  <dialog class="cushion-dialog" aria-labelledby="cushion-title">
    <h2 id="cushion-title" tabindex="-1">좌복 이름 입력</h2>
    <form method="dialog" hidden>
      <label for="cushion-year">출생연도</label>
      <div class="cushion-year-field">
        <input id="cushion-year" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"
          placeholder="1988" aria-describedby="cushion-year-suffix">
        <span id="cushion-year-suffix">년생</span>
      </div>
      <label for="cushion-name">이름</label>
      <input id="cushion-name" type="text" placeholder="대장금" autocomplete="name" maxlength="60">
      <div class="cushion-actions">
        <button type="button">닫기</button>
        <button type="submit" value="confirm">확인</button>
      </div>
    </form>
    <p class="seat-entry-status" role="status"></p>
  </dialog>
  <script>
    const { text: prayerText, choose: prayerCopy, title: prayerTitle } = prayerLanguage;
    const galleryCaptions = {
      cathedral: [
        '아침빛이 드는 중앙 통로와 제단',
        '십자가와 흰 돌 제단',
        '보석빛 스테인드글라스 장미창',
        '스테인드글라스 빛이 비치는 측랑',
        '성모상과 촛불이 있는 소성당',
        '측면에서 바라본 제단',
        '고딕 천장 아치와 기둥',
        '파이프오르간과 성가대석',
        '노을빛이 비치는 중앙 통로',
        '촛불로 밝혀진 저녁 제단',
      ],
      church: [
        '아침빛이 드는 교회 중앙 통로',
        '나무 십자가와 강단',
        '창가에서 바라본 예배당',
        '강단에 펼쳐진 성경',
        '피아노가 있는 예배당 앞자리',
        '예배당 천장과 나무 들보',
        '강단에서 바라본 예배당 좌석',
        '빗방울 맺힌 창가의 성경',
        '노을이 비치는 예배당 통로',
        '저녁빛 아래의 십자가와 강단',
      ],
    };

    function startGallery(space) {
      const captions = galleryCaptions[space];
      const frames = captions.map((caption, index) => {
        const frame = new Image();
        frame.src = './assets/' + space + '/' + String(index + 1).padStart(2, '0') + '.webp';
        frame.alt = prayerText(caption);
        return frame;
      });
      const title = document.querySelector('#view-title');
      const gallery = document.querySelector('.space-gallery');
      const toggle = gallery.querySelector('button');
      let index = 0;
      let timer = null;
      gallery.prepend(frames[index]);
      gallery.hidden = false;
      title.hidden = true;
      const play = () => {
        timer = window.setInterval(() => {
          const next = (index + 1) % frames.length;
          if (!frames[next].complete || !frames[next].naturalWidth) return;
          frames[index].replaceWith(frames[next]);
          index = next;
        }, 6000);
        toggle.textContent = prayerText('일시정지');
      };
      toggle.addEventListener('click', () => {
        if (timer === null) {
          play();
        } else {
          window.clearInterval(timer);
          timer = null;
          toggle.textContent = prayerText('재생');
        }
      });
      play();
    }

    const templeHalls = {
      daejeokgwangjeon: { name: '대적광전', alt: '금빛 비로자나불과 푸른 단청이 보이는 대적광전', image: 'daejeokgwangjeon.webp', color: '#316661' },
      daeungjeon: { name: '대웅전', alt: '단청과 연등 사이로 금빛 석가모니불이 보이는 대웅전', image: 'hall.webp', color: '#893d31' },
      muryangsujeon: { name: '무량수전', alt: '아미타불과 따뜻한 목조 기둥이 보이는 무량수전', image: 'muryangsujeon.webp', video: 'muryangsujeon-incense.mp4', audio: './assets/temple/chant/amitabha.mp3', color: '#98612a' },
      gwaneumjeon: { name: '관음전', alt: '흰 옷을 입은 관세음보살이 보이는 관음전', image: 'gwaneumjeon.webp', color: '#507968' },
      jijangjeon: { name: '지장전', alt: '보주와 석장을 지닌 지장보살이 보이는 지장전', image: 'jijangjeon.webp', color: '#48496e' },
      samseonggak: { name: '삼성각', alt: '왼쪽부터 산신·칠성·독성이 모셔진 삼성각', image: 'samseonggak.webp', color: '#714339' },

    function addSoundCaption(button, sizeLabel) {
      const size = document.createElement('span');
      size.className = 'chant-button-size';
      size.setAttribute('aria-hidden', 'true');
      size.textContent = sizeLabel;
      const caption = document.createElement('span');
      caption.className = 'chant-button-label';
      button.append(size, caption);
      return caption;
    }

    function setSoundCaption(button, caption, name, playing, isVideo = false) {
      const action = isVideo
        ? (playing
          ? prayerCopy('영상 끄기', 'Stop video', '停止视频', '動画を停止', 'Arrêter la vidéo')
          : prayerCopy('영상 재생', 'Play video', '播放视频', '動画を再生', 'Lire la vidéo'))
        : playing
        ? prayerCopy('소리 끄기', 'Sound off', '关闭声音', '音声オフ')
        : prayerCopy('소리 켜기', 'Sound on', '开启声音', '音声オン');
      caption.textContent = name + '\n' + action;
      button.setAttribute('aria-pressed', String(playing));
    }

    function addJijangChapterPicker(interior) {
      const controls = interior.querySelector('.chant-controls');

      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('aria-haspopup', 'dialog');
      addSoundCaption(button, name).textContent = name + '\n' + action;
      controls.append(button);

      let selected;
      for (let index = 1; index <= 13; index++) {

        chapter.textContent = label;
        chapter.setAttribute('aria-pressed', 'false');
        chapter.addEventListener('click', () => {
          selected?.setAttribute('aria-pressed', 'false');

    function stopVideo(video) {
      video.pause();
      video.remove();
      video.removeAttribute('src');
      video.load();
    }

    function addHallChants(interior, tracks, { audioDirectory = './assets/temple/chant/', middleButton } = {}) {
      const panel = interior.querySelector('.hall-chant');
      const controls = panel.querySelector('.chant-controls');
      const status = panel.querySelector('.chant-status');
      const audio = panel.querySelector('audio');
      let active = null;
      let attempt = 0;

      function stopActive() {
        const current = active;
        active = null;
        if (!current) return;
        if (current.media === audio) audio.pause();
        else if (current.media.tagName === 'IFRAME') current.media.remove();
        else stopVideo(current.media);
        current.setPlaying(false);
      }

      const buttons = tracks.map(([id, label, videoSource, { audioSource, fullFrame = false, youtubeId } = {}]) => {
        const button = document.createElement('button');
        const name = prayerText(label);
        const available = Boolean(id || audioSource || videoSource || youtubeId);
        button.type = 'button';
        const caption = addSoundCaption(button, (available ? '▶ ' : '') + name);
        const setPlaying = (playing) => setSoundCaption(button, caption, name, playing, Boolean(videoSource || youtubeId));
        if (available) setPlaying(false);
        else caption.textContent = name;

        button.addEventListener('click', async () => {
          status.textContent = '';
          if (!available) {
            status.textContent = prayerCopy('준비중입니다', 'Coming soon', '准备中', '準備中です');
            return;
          }

          const currentAttempt = ++attempt;
          const toggledOff = active?.button === button;
          stopActive();
          if (toggledOff) return;

          const media = youtubeId ? document.createElement('iframe') : videoSource ? document.createElement('video') : audio;
          if (youtubeId) {
            media.className = 'chant-video chant-youtube';
            media.title = name + ' 유튜브 재생';
            media.allow = 'autoplay; encrypted-media; picture-in-picture';
            media.allowFullscreen = true;
            media.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(youtubeId) + '?autoplay=1&playsinline=1';
            panel.before(media);
          } else if (videoSource) {
            media.className = 'chant-video';
            media.loop = true;
            media.playsInline = true;
            if (fullFrame) media.classList.add('chant-video--full-frame');
            panel.before(media);
            media.src = videoSource;
          } else {
            const source = audioSource || (audioDirectory + id + '.mp3');
            if (audio.getAttribute('src') !== source || audio.error) audio.src = source;
          }
          active = { button, media, setPlaying };
          if (label.includes('사시예불')) {
            audio.loop = false;
            openSasiBook({ audio, onClose: () => { audio.pause(); stopActive(); } });
          }
          setPlaying(true);
          try {
            if (!youtubeId) await media.play();
          } catch {
            if (currentAttempt !== attempt) return;
            stopActive();
            status.textContent = prayerCopy('재생할 수 없어요. 다시 눌러 주세요.', 'Unable to play. Tap to try again.', '无法播放，请重试。', '再生できません。もう一度お試しください。', 'Lecture impossible. Réessayez.');
          }
        });
        return button;
      });

      window.addEventListener('pagehide', () => {
        attempt++;
        stopActive();
      });
      if (middleButton) buttons.splice(1, 0, middleButton);
      controls.replaceChildren(...buttons);
      panel.hidden = false;
    }

    function formatMemorialName(value, suffix) {
      const name = value.trim().replace(new RegExp('(?:\\s*' + suffix + ')+$'), '').trim();
      return name ? name + ' ' + prayerText(suffix) : '';
    }

    function fitSeatName(label) {
      const { width, height } = label.getBoundingClientRect();
      const lines = Array.from(label.children);
      if (!width || !height || !lines.length) return;

      // Measure the natural width of each full line, including its padding.
      const sizes = lines.map(line => {
        let low = 0;
        let high = height;
        while (high - low > 0.1) {
          const size = (low + high) / 2;
          line.style.fontSize = size + 'px';
          if (line.getBoundingClientRect().width <= width) low = size;
          else high = size;
        }
        line.style.fontSize = low + 'px';
        return low;
      });

      const totalHeight = lines.reduce((total, line) => total + line.getBoundingClientRect().height, 0);
      if (totalHeight > height) {
        lines.forEach((line, index) => {
          line.style.fontSize = sizes[index] * (height - 0.25) / totalHeight + 'px';
        });
      }
    }

    function seatNameForm(onSubmit, onCancel) {
      const dialog = document.querySelector('.cushion-dialog');
      const title = dialog.querySelector('h2');
      const form = dialog.querySelector('form');
      const yearInput = form.querySelector('#cushion-year');
      const nameInput = form.querySelector('#cushion-name');
      const submit = form.querySelector('button[type="submit"]');
      const status = dialog.querySelector('.seat-entry-status');
      const viewport = window.visualViewport;
      let isMemorial = false;

      function fitToViewport() {
        if (!dialog.open || !viewport) return;
        dialog.style.setProperty('--form-viewport-top', viewport.offsetTop + 'px');
        dialog.style.setProperty('--form-viewport-height', viewport.height + 'px');
      }
      viewport?.addEventListener('resize', fitToViewport);
      viewport?.addEventListener('scroll', fitToViewport);
      yearInput.addEventListener('input', () => {
        if (!isMemorial) yearInput.value = yearInput.value.replace(/[^0-9]/g, '').slice(0, 4);
      });
      form.querySelector('button[type="button"]').addEventListener('click', onCancel);
      form.addEventListener('submit', event => {
        event.preventDefault();
        onSubmit({ year: yearInput.value.trim(), name: nameInput.value.trim() });
      });

      return {
        dialog, form, submit, status,
        open() {
          dialog.showModal();
          title.focus();
          dialog.scrollTop = 0;
          fitToViewport();
        },
        load(label, memorial, entry) {
          isMemorial = memorial;
          title.textContent = prayerCopy(label + (memorial ? ' 복위·영가 입력' : ' 이름 입력'), label + (memorial ? ' · Sponsor and departed names' : ' · Enter a name'), label + (memorial ? ' · 填写祈福人与亡者姓名' : ' · 填写姓名'), label + (memorial ? '・祈願者と故人の名前を入力' : '・名前を入力'), label + (memorial ? ' · Saisir les noms de la personne qui prie et du défunt' : ' · Saisir un nom'));
          document.title = title.textContent + ' | NOW Mind Search';
          if (memorial) {
            form.querySelector('label[for="cushion-year"]').textContent = prayerText('복위');
            form.querySelector('label[for="cushion-name"]').textContent = prayerText('영가');
            form.querySelector('#cushion-year-suffix').hidden = true;
            yearInput.removeAttribute('aria-describedby');
            yearInput.removeAttribute('inputmode');
            yearInput.removeAttribute('pattern');
            yearInput.maxLength = 60;
            yearInput.placeholder = prayerText('홍길동 복위');
            nameInput.placeholder = prayerText('아버지 영가');
            nameInput.removeAttribute('autocomplete');
          }
          yearInput.value = entry?.year ?? '';
          nameInput.value = entry?.name ?? '';
          form.hidden = false;
          status.textContent = '';
        },
      };
    }

    function openSeatEntryPage() {
      const parent = window.opener;
      const origin = location.origin;
      const editor = seatNameForm(entry => {
        editor.submit.disabled = true;
        editor.status.textContent = prayerText('좌석에 반영 중…');
        parent.postMessage({ type: 'prayer-seat-save', entry }, origin);
        window.setTimeout(() => {
          if (saved) return;
          editor.submit.disabled = false;
          editor.status.textContent = prayerText('좌석에 반영하지 못했습니다. 기도 공간 창이 열려 있는지 확인해 주세요.');
        }, 2500);
      }, () => window.close());
      let saved = false;
      document.querySelector('#space-intro').hidden = true;
      document.body.classList.add('seat-entry-page');
      editor.dialog.addEventListener('cancel', event => {
        event.preventDefault();
        window.close();
      });
      editor.open();
      editor.status.textContent = prayerText('선택한 좌석을 불러오는 중…');
      if (!parent) {
        editor.status.textContent = prayerText('기도 공간에서 좌복이나 의자를 눌러 열어 주세요.');
        return;
      }

        if (event.origin !== origin || event.source !== parent) return;
        const data = event.data;
        if (data?.type === 'prayer-seat-load') {
          editor.load(data.label, data.memorial, data.entry);
        } else if (data?.type === 'prayer-seat-saved') {
          saved = true;
          editor.status.textContent = prayerText('좌석에 반영했습니다. 이 창을 닫아 돌아갈 수 있습니다.');
          window.close();
        }
      });
      parent.postMessage({ type: 'prayer-seat-ready' }, origin);
      window.setTimeout(() => {
        if (editor.form.hidden) editor.status.textContent = prayerText('기도 공간에서 좌복이나 의자를 다시 눌러 주세요.');
      }, 2500);
    }

    const sharedFixedSeats = new Map([
      [1, { year: '2010', name: '이승오' }],
      [2, { year: '1976', name: '김경하' }],
      [3, { year: '1974', name: '김선하' }],
      [4, { year: '2005', name: '박영규' }],
      [5, { year: '', name: '김혜영' }],
      [6, { year: '1971', name: '김완호' }],
      [7, { year: '2009', name: '박세인' }],
      [8, { year: '1942', name: '양광생' }],
    ]);

    const fixedSeatsByHall = new Map([
      ['daejeokgwangjeon', sharedFixedSeats],
      ['daeungjeon', sharedFixedSeats],
      ['gwaneumjeon', sharedFixedSeats],
      ['samseonggak', sharedFixedSeats],
      ['muryangsujeon', new Map([
        [2, { year: '김선하', name: '김도범' }],
        [3, { year: '김선하', name: '최팔선' }],
      ])],
      ['jijangjeon', new Map([
        [2, { year: '김경하', name: '김도범' }],
        [3, { year: '김경하', name: '최팔선' }],
      ])],
    ]);

    function numberedSeat(seatLabel, number) {
      const label = prayerText(seatLabel);
      return prayerCopy(label + ' ' + number + '번', label + ' ' + number, number + '号' + label, number + '番の' + label, label + ' ' + number);
    }

    function enableSeatNames(plan, seatLabel, memorial = false, fixedSeats) {
      const entries = new Map();
      const labelObserver = new ResizeObserver(records => {
        for (const { target } of records) fitSeatName(target);
      });
      let selectedButton;
      let fallback;
      const origin = location.origin;
      const editorUrl = new URL(location.href);
      editorUrl.search = '?seat-entry=1&v=shared-fixed-seats';
      editorUrl.hash = '';

      function saveSeatName(button, number, { year, name }) {
        entries.set(number, { year, name });
        const lines = (memorial
          ? [formatMemorialName(year, '복위'), formatMemorialName(name, '영가')]
          : [year ? prayerCopy(year + '년생', year, year + '年出生', year + '年生まれ', year) : '', name]).filter(Boolean);
        const display = button.querySelector('.seat-name-label');
        display.replaceChildren(...lines.map((text) => {
          const line = document.createElement('span');
          line.className = 'seat-name-line';
          line.textContent = text;
          return line;
        }));
        const label = numberedSeat(seatLabel, number);
        if (!lines.length) {
          labelObserver.unobserve(display);
          button.removeAttribute('title');
          button.setAttribute('aria-label', label);
          return;
        }
        fitSeatName(display);
        labelObserver.observe(display);
        const summary = lines.join(' ');
        document.fonts.load('16px OKGUNG', summary).then(
          () => fitSeatName(display),
          () => fitSeatName(display),
        );
        button.title = summary;
        button.setAttribute('aria-label', label + ', ' + summary);
      }

      let activeEditor;
      window.addEventListener('message', event => {
        if (event.origin !== origin || !activeEditor || event.source !== activeEditor.popup) return;
        const data = event.data;
        const { popup, button, number, label } = activeEditor;
        if (data?.type === 'prayer-seat-ready') {
          popup.postMessage({ type: 'prayer-seat-load', label, memorial, entry: entries.get(number) }, origin);
        } else if (data?.type === 'prayer-seat-save' &&
          typeof data.entry?.year === 'string' && typeof data.entry?.name === 'string') {
          saveSeatName(button, number, data.entry);
          popup.postMessage({ type: 'prayer-seat-saved' }, origin);
        }
      });

      plan.querySelectorAll('.paired-row > button').forEach((button, index) => {
        const number = index + 1;
        const label = numberedSeat(seatLabel, number);
        button.setAttribute('aria-label', label);
        const display = document.createElement('span');
        display.className = 'seat-name-label';
        display.setAttribute('aria-hidden', 'true');
        button.append(display);
        const fixedEntry = fixedSeats?.get(number);
        if (fixedEntry) {
          button.disabled = true;
          saveSeatName(button, number, fixedEntry);
          button.setAttribute('aria-description', prayerCopy('이름이 고정된 ' + seatLabel, 'Seat with a fixed name', '姓名固定的座位', '名前が固定された座席', 'Place avec un nom fixe'));
          return;
        }
        button.setAttribute('aria-description', prayerText('이름 입력 화면을 새 창으로 열기'));
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => {
          selectedButton?.setAttribute('aria-pressed', 'false');
          selectedButton = button;
          button.setAttribute('aria-pressed', 'true');
          activeEditor?.popup.close();
          activeEditor = undefined;
          const popup = window.open(editorUrl.href, '_blank');
          if (popup && !popup.closed) {
            activeEditor = { popup, button, number, label };
            popup.focus();
            return;
          }

          const pageTitle = document.title;
          const editor = fallback ??= seatNameForm(entry => {
            const seat = editor.seat;
            saveSeatName(seat.button, seat.number, entry);
            editor.dialog.close();
          }, () => editor.dialog.close());
          editor.seat = { button, number };
          editor.dialog.addEventListener('close', () => { document.title = pageTitle; }, { once: true });
          editor.load(label, memorial, entries.get(number));
          editor.open();
        });
      });
    }

    const seatRows = 4;
    const seatsPerSide = 2;
    const chairImages = {
      church: './assets/church/chair.webp',
      cathedral: './assets/cathedral/leather-chair.webp',
    };

    function buildSeating(plan, chairImage) {
      const seatType = chairImage ? '의자' : '좌복';
      const seatCount = seatRows * seatsPerSide * 2;
      plan.style.setProperty('--seat-rows', seatRows);
      plan.style.setProperty('--seats-per-side', seatsPerSide);
      plan.setAttribute('aria-label',
        prayerCopy(
          `중앙 통로 양쪽에 ${seatType} ${seatsPerSide}개씩, ${seatRows}줄로 배치된 자리 ${seatCount}개`,
          `${seatCount} seats in ${seatRows} rows, with ${seatsPerSide} seats on each side of the aisle per row`,
          `共${seatCount}个座位，分为${seatRows}排，每排在中央通道两侧各有${seatsPerSide}个座位`,
          `全${seatCount}席、${seatRows}列。各列の中央通路の左右に${seatsPerSide}席ずつあります`,
          `${seatCount} places sur ${seatRows} rangées, avec ${seatsPerSide} places de chaque côté de l’allée dans chaque rangée`));
      const aisle = document.createElement('div');
      aisle.className = 'paired-aisle';
      aisle.setAttribute('aria-hidden', 'true');
      const rows = Array.from({ length: seatRows }, () => {
        const row = document.createElement('div');
        row.className = 'paired-row';
        for (let index = 0; index < seatsPerSide * 2; index++) {
          const seat = document.createElement('button');
          seat.type = 'button';
          seat.className = chairImage ? 'chair-name-button' : 'temple-cushion';
          if (index === seatsPerSide) seat.classList.add('first-seat-right');
          if (chairImage) {
            const chair = new Image(160, 160);
            chair.src = chairImage;
            chair.alt = '';
            chair.className = 'upholstered-chair';
            seat.append(chair);
          }
          row.append(seat);
        }
        return row;
      });
      plan.replaceChildren(aisle, ...rows);
      return seatCount;
    }

    function createTempleVideoControl(scene, hall, image) {
      const audio = document.createElement('audio');
      audio.preload = 'none';
      audio.loop = true;
      audio.src = hall.audio;

      const button = document.createElement('button');
      button.type = 'button';
      const name = prayerCopy('나무아미타불', 'Amitabha chant', '南无阿弥陀佛', '南無阿弥陀仏');
      const caption = addSoundCaption(button, name);
      let video = null;

      function stop() {
        const playing = video;
        video = null;
        if (playing) stopVideo(playing);
        audio.pause();
        setSoundCaption(button, caption, name, false);
      }

      audio.addEventListener('pause', () => {
        if (video && audio.paused) stop();
      });

      button.addEventListener('click', async () => {
        if (video) {
          stop();
          return;
        }

        const next = document.createElement('video');
        next.setAttribute('aria-hidden', 'true');
        next.poster = image.src;
        next.loop = true;
        next.defaultMuted = true;
        next.muted = true;
        next.playsInline = true;
        next.src = './assets/temple/' + hall.video;
        video = next;
        scene.insertBefore(next, audio);
        setSoundCaption(button, caption, name, true);
        if (audio.error) audio.load();
        audio.currentTime = 0;
        try {
          await Promise.all([audio.play(), next.play()]);
        } catch {
          if (video !== next) return;
          stop();
          caption.textContent = prayerCopy('재생 다시 시도', 'Retry playback', '重试播放', '再生を再試行', 'Relancer la lecture');
        }
      });

      window.addEventListener('pagehide', stop);
      setSoundCaption(button, caption, name, false);
      scene.append(audio);
      return button;
    }

    function openTempleHall(hall, interior) {
      const view = interior.querySelector('.space-gallery');
      const image = new Image();
      image.src = './assets/temple/' + hall.image;
      image.alt = prayerText(hall.alt);
      const section = view.parentElement;
      let videoButton;
      if (hall.video) {
        const scene = document.createElement('div');
        scene.className = 'temple-motion';
        scene.append(image);
        videoButton = createTempleVideoControl(scene, hall, image);
        view.replaceWith(scene);
      } else {
        view.replaceWith(image);
      }
      section.classList.add('temple-view');
      section.querySelector('#view-title').hidden = true;
      return videoButton;
    }

    const params = new URLSearchParams(location.search);
    const space = params.get('space');
    const hallId = params.get('hall') || 'daeungjeon';
    const hall = space === 'temple' && Object.hasOwn(templeHalls, hallId) ? templeHalls[hallId] : null;
    const spaces = new Map([['church', '교회'], ['cathedral', '성당']]);
    const name = hall?.name ?? spaces.get(space);
    if (params.get('seat-entry') === '1') {
      openSeatEntryPage();
    } else if (name) {
      document.title = prayerTitle(name);
      document.querySelector('#space-intro').hidden = true;
      const interior = document.querySelector('#space-interior');
      interior.setAttribute('aria-label', prayerCopy(name + ' 내부', 'Inside ' + prayerText(name), prayerText(name) + '内部', prayerText(name) + 'の堂内', 'Intérieur · ' + prayerText(name)));
      const seating = interior.querySelector('.seating');
      seating.classList.add('furnished-seating', space + '-seating');
      const plan = seating.querySelector('.seating-plan');
      const capacity = buildSeating(plan, chairImages[space]);
      const seatKind = hall ? '좌복' : '의자';
      const guide = interior.querySelector('.seat-guide');
      guide.replaceChildren(
        prayerCopy(
          seatKind + '를 선택하시고 기도하시려는 분의 성함을 넣으세요.',
          'Choose a ' + prayerText(seatKind).toLowerCase() + ' and enter the name of the person you are praying for.',
          '请选择' + prayerText(seatKind) + '，然后填写您想为之祈祷的人的姓名。',
          prayerText(seatKind) + 'を選び、祈りをささげる方のお名前を入力してください。',
          'Choisissez une place et saisissez le nom de la personne pour laquelle vous priez.'),
        document.createElement('br'),
        prayerCopy('최대 ' + capacity + '명까지 가능합니다.', 'Up to ' + capacity + ' people.', '最多可填写' + capacity + '人。', '最大' + capacity + '名まで入力できます。', 'Jusqu’à ' + capacity + ' personnes.'));

      if (hall) {
        if (hallId === 'daeungjeon' || hallId === 'muryangsujeon' || hallId === 'gwaneumjeon') interior.classList.add(hallId);
        seating.setAttribute('aria-label', '수행 공간');
        plan.style.setProperty('--cushion-color', hall.color);
        const middleButton = openTempleHall(hall, interior);
        const memorial = hallId === 'muryangsujeon' || hallId === 'jijangjeon';
        enableSeatNames(plan, '좌복', memorial, fixedSeatsByHall.get(hallId));
        const tracks = hallChants[hallId];
        if (tracks) addHallChants(interior, tracks, { middleButton });

        if (hallId === 'jijangjeon') addJijangChapterPicker(interior);
        const backLink = seating.querySelector('.home-return');
        backLink.href = './temple.html?v=centered-sound-v2';
        backLink.textContent = '각 전각으로 돌아가기';
      } else {
        enableSeatNames(plan, '좌석', false, sharedFixedSeats);
        startGallery(space);
        if (space === 'church') {
          addHallChants(interior, [['amen', '아멘']], { audioDirectory: './assets/church/chant/' });
        } else if (space === 'cathedral') {
          addHallChants(interior, [['ave-maria', '아베마리아', null, { audioSource: './Ave_Maria_14seconds_300ms.mp3' }]], { audioDirectory: './assets/cathedral/chant/' });
        }
      }
      interior.hidden = false;
    }
  </script>
</body>
