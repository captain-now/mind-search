<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기도 공간 | NOW Mind Search</title>
  <style>
    body { margin: 0; background: #fcedf0; color: #263d36; font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: auto; padding: 40px 20px; }
    a { color: #355a48; }
    .interior:not([hidden]) {
      display: grid;
      grid-template-rows: minmax(140px, 1fr) auto minmax(244px, 1fr);
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      max-width: none;
      padding: 0;
    }
    .interior section { display: grid; place-items: center; }
    .interior section + section { border-top: 1px solid #b8949f; }
    .interior h2 { margin: 0; font-size: clamp(24px, 6vw, 36px); }
    .interior .seating { min-height: 0; border-top: 1px solid #b8949f; background: #f5e8d5; }
    .space-gallery {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2f2118;
    }
    .space-gallery img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .space-gallery button {
      position: absolute;
      right: 12px;
      bottom: 12px;
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #fff9;
      border-radius: 22px;
      background: #21160de0;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .space-gallery button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .interior .furnished-seating {
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .home-return {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      box-sizing: border-box;
      margin: 6px 12px max(8px, env(safe-area-inset-bottom));
      padding: 6px 14px;
      border-radius: 22px;
      background: #355a48;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .home-return:focus-visible { outline: 2px solid #263d36; outline-offset: 2px; }
    .interior .church-seating {
      background: #ecdbba url("./assets/church/marble-floor.webp") center / 360px 360px repeat;
    }
    .interior .cathedral-seating {
      background: #ecdbba url("./assets/church/marble-floor.webp") center / 360px 360px repeat;
    }
    .cathedral-seating .paired-aisle {
      background: #641b29 url("./assets/cathedral/runner.webp") center / 100% 100% no-repeat;
      box-shadow: 0 1px 4px #37130e50;
    }
    .upholstered-chair {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      transform: rotate(180deg);
    }
    @media (max-height: 600px) and (orientation: landscape) {
      .interior:not([hidden]) { min-height: 620px; }
    }
    .temple-view {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #35231a;
    }
    .temple-view img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .interior .temple-seating {
      background:
        repeating-linear-gradient(90deg, #52301c22 0 1px, transparent 1px 66px),
        linear-gradient(135deg, #b98754, #7d4e2e);
    }
    .seating-plan {
      --aisle-width: 18%;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(var(--seat-rows), minmax(0, 1fr));
      gap: clamp(4px, 1dvh, 10px);
      width: min(100%, 520px);
      height: 100%;
      box-sizing: border-box;
      padding: clamp(8px, 1.8dvh, 16px) 0;
    }
    .paired-aisle {
      position: absolute;
      inset: 0 calc((100% - var(--aisle-width)) / 2);
    }
    .temple-seating .paired-aisle {
      background: #f6cf8833;
      border-inline: 1px solid #69432255;
    }
    .paired-row {
      display: grid;
      grid-template-columns: repeat(var(--seats-per-side), minmax(0, 1fr)) var(--aisle-width) repeat(var(--seats-per-side), minmax(0, 1fr));
      width: 100%;
      place-items: center;
      min-height: 0;
      container-type: size;
    }
    .paired-row > .first-seat-right { grid-column: calc(var(--seats-per-side) + 2); }
    .temple-cushion[type="button"], .chair-name-button { padding: 0; cursor: pointer; }
    .temple-cushion:disabled, .chair-name-button:disabled { cursor: default; opacity: 1; }
    .chair-name-button {
      min-height: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
    }
    .paired-row .chair-name-button .upholstered-chair {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      /* Compensate for the transparent side margins in both chair images. */
      transform: rotate(180deg) scaleX(1.48);
    }
    .temple-cushion, .chair-name-button {
      width: min(86%, 108px, 125cqh);
      aspect-ratio: 1.6;
      box-sizing: border-box;
    }
    .temple-cushion[aria-pressed="true"], .chair-name-button[aria-pressed="true"] { outline: 3px solid #ffe19a; outline-offset: 2px; }
    .temple-cushion:focus-visible, .chair-name-button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .temple-cushion {
      border: 1px solid #40281c;
      border-radius: 18%;
      background: var(--cushion-color);
      box-shadow: inset 0 0 0 2px #e5b07966, inset 0 4px 12px #fff2, 0 2px 3px #41241480;
    }
    .interior.with-chant:not([hidden]) {
      grid-template-rows: minmax(140px, 1fr) auto auto minmax(244px, 1fr);
    }
    .seat-guide {
      margin: 0;
      padding: 8px 12px;
      border-block: 1px solid #dbcdb7;
      background: #fff9ed;
      color: #30251b;
      text-align: center;
      font-size: clamp(12px, 3.5vw, 15px);
      line-height: 1.4;
    }
    .hall-chant {
      min-width: 0;
      padding: 6px 10px;
      background: #f6efe2;
      color: #30251b;
      font: 600 14px/1.3 system-ui, sans-serif;
      text-align: center;
    }
    .hall-chant strong { display: block; margin-bottom: 4px; }
    .chant-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .chant-controls button {
      min-height: 44px;
      padding: 4px 10px;
      border: 1px solid #355a48;
      border-radius: 12px;
      background: #fff9e9;
      color: #274637;
      font: inherit;
      cursor: pointer;
    }
    .chant-controls button[aria-pressed="true"] { background: #355a48; color: #fff; }
    .chant-controls button:focus-visible { outline: 2px solid #986538; outline-offset: 2px; }
    .chant-status:not(:empty) { display: block; margin-top: 4px; }
    .temple-cushion[type="button"], .chair-name-button { position: relative; }
    /* 읏맨-궁서체 · OK금융그룹 */
    @font-face {
      font-family: "OKGUNG";
      src: url("./assets/fonts/OKGUNG.woff2") format("woff2");
      font-display: swap;
    }
    .seat-name-label {
      position: absolute;
      inset: 2px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      justify-items: center;
      overflow: hidden;
      pointer-events: none;
      font: 400 10px/1.08 "OKGUNG", Gungsuh, "궁서", serif;
    }
    .seat-name-line {
      width: max-content;
      white-space: nowrap;
      padding-inline: 2px;
      box-sizing: border-box;
      border-radius: 3px;
      background: #261b15ed;
      color: #fff;
    }
    .seat-entry-page { background: #fff9ed; }
    .cushion-dialog {
      box-sizing: border-box;
      position: fixed;
      inset: var(--form-viewport-top, 0px) 0 auto;
      margin: 0;
      width: 100%;
      max-width: none;
      height: var(--form-viewport-height, 100dvh);
      max-height: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      border: 0;
      background: #fff9ed;
      color: #30251b;
    }
    .cushion-dialog::backdrop { background: #fff9ed; }
    .cushion-dialog h2, .cushion-dialog form, .seat-entry-status { max-width: 480px; margin-inline: auto; }
    .cushion-dialog h2 { margin-block: 0 24px; font-size: clamp(24px, 6vw, 34px); }
    .cushion-dialog form:not([hidden]) { display: grid; gap: 12px; }
    .cushion-dialog input {
      box-sizing: border-box; width: 100%; min-height: 52px; padding: 10px 12px;
      border: 1px solid #89715b; border-radius: 8px; font: inherit; font-size: 18px;
    }
    .seat-entry-status { margin-block: 16px 0; }
    .cushion-year-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .cushion-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .cushion-actions button {
      min-height: 44px; padding: 6px 12px; border: 1px solid #355a48;
      border-radius: 10px; background: #fff9ed; color: #355a48; font: inherit;
    }
    .cushion-actions button[type="submit"] { background: #355a48; color: #fff; }
  </style>
</head>
<body>
  <main id="space-intro">
    <h1 id="space-title">기도 공간</h1>
    <p id="space-status" hidden>이 공간은 준비 중이에요.</p>
    <a href="./prayer.html">공간 선택으로 돌아가기</a>
  </main>
  <main id="space-interior" class="interior" hidden>
    <section aria-label="전경">
      <h2 id="view-title">전경</h2>
      <div class="space-gallery" hidden>
        <button type="button">일시정지</button>
      </div>
    </section>
    <div class="hall-chant" role="group" aria-labelledby="chant-heading" hidden>
      <strong id="chant-heading">NOW 마음챙김 · 정근</strong>
      <div class="chant-controls"></div>
      <span class="chant-status" role="status"></span>
      <audio loop preload="none"></audio>
    </div>
    <p class="seat-guide"><span class="seat-guide-item">의자</span>를 선택하시고 기도하시려는 분의 성함을 넣으세요.<br>
      최대 <span class="seat-capacity"></span>명까지 가능합니다.</p>
    <section class="seating" aria-label="좌석">
      <div class="seating-plan" role="group"></div>
      <a class="home-return" href="./prayer.html?v=shared-fixed-seats">기도공간으로 돌아가기</a>
    </section>
  </main>
  <dialog class="cushion-dialog" aria-labelledby="cushion-title">
    <h2 id="cushion-title" tabindex="-1">좌복 이름 입력</h2>
    <form method="dialog" hidden>
      <label for="cushion-year">출생연도</label>
      <div class="cushion-year-field">
        <input id="cushion-year" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"
          placeholder="1988" aria-describedby="cushion-year-suffix">
        <span id="cushion-year-suffix">년생</span>
      </div>
      <label for="cushion-name">이름</label>
      <input id="cushion-name" type="text" placeholder="대장금" autocomplete="name" maxlength="60">
      <div class="cushion-actions">
        <button type="button">닫기</button>
        <button type="submit" value="confirm">확인</button>
      </div>
    </form>
    <p class="seat-entry-status" role="status"></p>
  </dialog>
  <script>
    const galleryCaptions = {
      cathedral: [
        '아침빛이 드는 중앙 통로와 제단',
        '십자가와 흰 돌 제단',
        '보석빛 스테인드글라스 장미창',
        '스테인드글라스 빛이 비치는 측랑',
        '성모상과 촛불이 있는 소성당',
        '측면에서 바라본 제단',
        '고딕 천장 아치와 기둥',
        '파이프오르간과 성가대석',
        '노을빛이 비치는 중앙 통로',
        '촛불로 밝혀진 저녁 제단',
      ],
      church: [
        '아침빛이 드는 교회 중앙 통로',
        '나무 십자가와 강단',
        '창가에서 바라본 예배당',
        '강단에 펼쳐진 성경',
        '피아노가 있는 예배당 앞자리',
        '예배당 천장과 나무 들보',
        '강단에서 바라본 예배당 좌석',
        '빗방울 맺힌 창가의 성경',
        '노을이 비치는 예배당 통로',
        '저녁빛 아래의 십자가와 강단',
      ],
    };

    function startGallery(space) {
      const captions = galleryCaptions[space];
      const frames = captions.map((caption, index) => {
        const frame = new Image();
        frame.src = './assets/' + space + '/' + String(index + 1).padStart(2, '0') + '.webp';
        frame.alt = caption;
        return frame;
      });
      const title = document.querySelector('#view-title');
      const gallery = document.querySelector('.space-gallery');
      const toggle = gallery.querySelector('button');
      let index = 0;
      let timer = null;
      gallery.prepend(frames[index]);
      gallery.hidden = false;
      title.hidden = true;
      const play = () => {
        timer = window.setInterval(() => {
          const next = (index + 1) % frames.length;
          if (!frames[next].complete || !frames[next].naturalWidth) return;
          frames[index].replaceWith(frames[next]);
          index = next;
        }, 6000);
        toggle.textContent = '일시정지';
      };
      toggle.addEventListener('click', () => {
        if (timer === null) {
          play();
        } else {
          window.clearInterval(timer);
          timer = null;
          toggle.textContent = '재생';
        }
      });
      play();
    }

    const templeHalls = {
      daejeokgwangjeon: { name: '대적광전', alt: '금빛 비로자나불과 푸른 단청이 보이는 대적광전', image: 'daejeokgwangjeon.webp', color: '#316661' },
      daeungjeon: { name: '대웅전', alt: '단청과 연등 사이로 금빛 석가모니불이 보이는 대웅전', image: 'hall.webp', color: '#893d31' },
      muryangsujeon: { name: '무량수전', alt: '아미타불과 따뜻한 목조 기둥이 보이는 무량수전', image: 'muryangsujeon.webp', color: '#98612a' },
      gwaneumjeon: { name: '관음전', alt: '흰 옷을 입은 관세음보살이 보이는 관음전', image: 'gwaneumjeon.webp', color: '#507968' },
      jijangjeon: { name: '지장전', alt: '보주와 석장을 지닌 지장보살이 보이는 지장전', image: 'jijangjeon.webp', color: '#48496e' },
      samseonggak: { name: '삼성각', alt: '왼쪽부터 산신·칠성·독성이 모셔진 삼성각', image: 'samseonggak.webp', color: '#714339' },
    };

    const hallChants = {
      "daejeokgwangjeon": [
        [
          "om-nam",
          "옴남"
        ]
      ],
      "daeungjeon": [
        [
          "shakyamuni",
          "석가모니불"
        ]
      ],
      "muryangsujeon": [
        [
          "amitabha",
          "나무아미타불"
        ]
      ],
      "gwaneumjeon": [
        [
          "avalokiteshvara",
          "관세음보살"
        ],
        [
          "mani",
          "옴마니반메홈"
        ]
      ],
      "jijangjeon": [["jijang", "지장보살"]],
      "samseonggak": [
        [
          "sansin",
          "산왕대신"
        ],
        [
          "chilseong",
          "칠원성군"
        ],
        [
          "dokseong",
          "나반존자"
        ]
      ]
    };

    function addHallChants(interior, tracks, audioDirectory = './assets/temple/chant/') {
      const panel = interior.querySelector('.hall-chant');
      const controls = panel.querySelector('.chant-controls');
      const status = panel.querySelector('.chant-status');
      const audio = panel.querySelector('audio');
      let selected = null;
      let attempt = 0;
      const buttons = tracks.map(([id, label]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '▶ ' + label;
        button.setAttribute('aria-label', label + ' 정근 재생 또는 일시정지');
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', async () => {
          const currentAttempt = ++attempt;
          status.textContent = '';
          if (selected === id && !audio.paused) {
            audio.pause();
            return;
          }
          if (selected !== id || audio.error) {
            selected = id;
            audio.src = audioDirectory + id + '.mp3';
          }
          try {
            await audio.play();
          } catch {
            if (currentAttempt === attempt) status.textContent = '음성을 재생할 수 없어요. 다시 눌러 주세요.';
          }
        });
        return { id, label, button };
      });
      const updateButtons = () => {
        for (const { id, label, button } of buttons) {
          const playing = selected === id && !audio.paused && !audio.error;
          button.textContent = (playing ? '⏸ ' : '▶ ') + label;
          button.setAttribute('aria-pressed', String(playing));
        }
      };
      for (const event of ['play', 'pause', 'error']) audio.addEventListener(event, updateButtons);
      window.addEventListener('pagehide', () => audio.pause());
      controls.replaceChildren(...buttons.map(({ button }) => button));
      panel.hidden = false;
      interior.classList.add('with-chant');
    }

    function formatMemorialName(value, suffix) {
      const name = value.trim().replace(new RegExp('(?:\\s*' + suffix + ')+$'), '').trim();
      return name ? name + ' ' + suffix : '';
    }

    function fitSeatName(label) {
      const { width, height } = label.getBoundingClientRect();
      const lines = Array.from(label.children);
      if (!width || !height || !lines.length) return;

      // Measure the natural width of each full line, including its padding.
      const sizes = lines.map(line => {
        let low = 0;
        let high = height;
        while (high - low > 0.1) {
          const size = (low + high) / 2;
          line.style.fontSize = size + 'px';
          if (line.getBoundingClientRect().width <= width) low = size;
          else high = size;
        }
        line.style.fontSize = low + 'px';
        return low;
      });

      const totalHeight = lines.reduce((total, line) => total + line.getBoundingClientRect().height, 0);
      if (totalHeight > height) {
        lines.forEach((line, index) => {
          line.style.fontSize = sizes[index] * (height - 0.25) / totalHeight + 'px';
        });
      }
    }

    function seatNameForm(onSubmit, onCancel) {
      const dialog = document.querySelector('.cushion-dialog');
      const title = dialog.querySelector('h2');
      const form = dialog.querySelector('form');
      const yearInput = form.querySelector('#cushion-year');
      const nameInput = form.querySelector('#cushion-name');
      const submit = form.querySelector('button[type="submit"]');
      const status = dialog.querySelector('.seat-entry-status');
      const viewport = window.visualViewport;
      let isMemorial = false;

      function fitToViewport() {
        if (!dialog.open || !viewport) return;
        dialog.style.setProperty('--form-viewport-top', viewport.offsetTop + 'px');
        dialog.style.setProperty('--form-viewport-height', viewport.height + 'px');
      }
      viewport?.addEventListener('resize', fitToViewport);
      viewport?.addEventListener('scroll', fitToViewport);
      yearInput.addEventListener('input', () => {
        if (!isMemorial) yearInput.value = yearInput.value.replace(/[^0-9]/g, '').slice(0, 4);
      });
      form.querySelector('button[type="button"]').addEventListener('click', onCancel);
      form.addEventListener('submit', event => {
        event.preventDefault();
        onSubmit({ year: yearInput.value.trim(), name: nameInput.value.trim() });
      });

      return {
        dialog, form, submit, status,
        open() {
          dialog.showModal();
          title.focus();
          dialog.scrollTop = 0;
          fitToViewport();
        },
        load(label, memorial, entry) {
          isMemorial = memorial;
          title.textContent = label + (memorial ? ' 복위·영가 입력' : ' 이름 입력');
          document.title = title.textContent + ' | NOW Mind Search';
          if (memorial) {
            form.querySelector('label[for="cushion-year"]').textContent = '복위';
            form.querySelector('label[for="cushion-name"]').textContent = '영가';
            form.querySelector('#cushion-year-suffix').hidden = true;
            yearInput.removeAttribute('aria-describedby');
            yearInput.removeAttribute('inputmode');
            yearInput.removeAttribute('pattern');
            yearInput.maxLength = 60;
            yearInput.placeholder = '홍길동 복위';
            nameInput.placeholder = '아버지 영가';
            nameInput.removeAttribute('autocomplete');
          }
          yearInput.value = entry?.year ?? '';
          nameInput.value = entry?.name ?? '';
          form.hidden = false;
          status.textContent = '';
        },
      };
    }

    function openSeatEntryPage() {
      const parent = window.opener;
      const origin = location.origin;
      const editor = seatNameForm(entry => {
        editor.submit.disabled = true;
        editor.status.textContent = '좌석에 반영 중…';
        parent.postMessage({ type: 'prayer-seat-save', entry }, origin);
        window.setTimeout(() => {
          if (saved) return;
          editor.submit.disabled = false;
          editor.status.textContent = '좌석에 반영하지 못했습니다. 기도 공간 창이 열려 있는지 확인해 주세요.';
        }, 2500);
      }, () => window.close());
      let saved = false;
      document.querySelector('#space-intro').hidden = true;
      document.body.classList.add('seat-entry-page');
      editor.dialog.addEventListener('cancel', event => {
        event.preventDefault();
        window.close();
      });
      editor.open();
      editor.status.textContent = '선택한 좌석을 불러오는 중…';
      if (!parent) {
        editor.status.textContent = '기도 공간에서 좌복이나 의자를 눌러 열어 주세요.';
        return;
      }
      window.addEventListener('message', event => {
        if (event.origin !== origin || event.source !== parent) return;
        const data = event.data;
        if (data?.type === 'prayer-seat-load') {
          editor.load(data.label, data.memorial, data.entry);
        } else if (data?.type === 'prayer-seat-saved') {
          saved = true;
          editor.status.textContent = '좌석에 반영했습니다. 이 창을 닫아 돌아갈 수 있습니다.';
          window.close();
        }
      });
      parent.postMessage({ type: 'prayer-seat-ready' }, origin);
      window.setTimeout(() => {
        if (editor.form.hidden) editor.status.textContent = '기도 공간에서 좌복이나 의자를 다시 눌러 주세요.';
      }, 2500);
    }

    const sharedFixedSeats = new Map([
      [1, { year: '2010', name: '이승오' }],
      [2, { year: '1976', name: '김경하' }],
      [3, { year: '1974', name: '김선하' }],
      [4, { year: '2005', name: '박영규' }],
      [5, { year: '', name: '김혜영' }],
      [6, { year: '1971', name: '김완호' }],
      [7, { year: '2009', name: '박세인' }],
    ]);

    const fixedSeatsByHall = new Map([
      ['daejeokgwangjeon', sharedFixedSeats],
      ['daeungjeon', sharedFixedSeats],
      ['gwaneumjeon', sharedFixedSeats],
      ['samseonggak', sharedFixedSeats],
      ['muryangsujeon', new Map([
        [2, { year: '김선하', name: '김도범' }],
        [3, { year: '김선하', name: '최팔선' }],
      ])],
      ['jijangjeon', new Map([
        [2, { year: '김경하', name: '김도범' }],
        [3, { year: '김경하', name: '최팔선' }],
      ])],
    ]);

    function enableSeatNames(plan, seatLabel, memorial = false, fixedSeats) {
      const entries = new Map();
      const labelObserver = new ResizeObserver(records => {
        for (const { target } of records) fitSeatName(target);
      });
      let selectedButton;
      let fallback;
      const origin = location.origin;
      const editorUrl = new URL(location.href);
      editorUrl.search = '?seat-entry=1&v=shared-fixed-seats';
      editorUrl.hash = '';

      function saveSeatName(button, number, { year, name }) {
        entries.set(number, { year, name });
        const lines = (memorial
          ? [formatMemorialName(year, '복위'), formatMemorialName(name, '영가')]
          : [year ? year + '년생' : '', name]).filter(Boolean);
        const display = button.querySelector('.seat-name-label');
        display.replaceChildren(...lines.map((text) => {
          const line = document.createElement('span');
          line.className = 'seat-name-line';
          line.textContent = text;
          return line;
        }));
        const label = seatLabel + ' ' + number + '번';
        if (!lines.length) {
          labelObserver.unobserve(display);
          button.removeAttribute('title');
          button.setAttribute('aria-label', label);
          return;
        }
        fitSeatName(display);
        labelObserver.observe(display);
        const summary = lines.join(' ');
        document.fonts.load('16px OKGUNG', summary).then(
          () => fitSeatName(display),
          () => fitSeatName(display),
        );
        button.title = summary;
        button.setAttribute('aria-label', label + ', ' + summary);
      }

      let activeEditor;
      window.addEventListener('message', event => {
        if (event.origin !== origin || !activeEditor || event.source !== activeEditor.popup) return;
        const data = event.data;
        const { popup, button, number, label } = activeEditor;
        if (data?.type === 'prayer-seat-ready') {
          popup.postMessage({ type: 'prayer-seat-load', label, memorial, entry: entries.get(number) }, origin);
        } else if (data?.type === 'prayer-seat-save' &&
          typeof data.entry?.year === 'string' && typeof data.entry?.name === 'string') {
          saveSeatName(button, number, data.entry);
          popup.postMessage({ type: 'prayer-seat-saved' }, origin);
        }
      });

      plan.querySelectorAll('.paired-row > button').forEach((button, index) => {
        const number = index + 1;
        const label = seatLabel + ' ' + number + '번';
        button.setAttribute('aria-label', label);
        const display = document.createElement('span');
        display.className = 'seat-name-label';
        display.setAttribute('aria-hidden', 'true');
        button.append(display);
        const fixedEntry = fixedSeats?.get(number);
        if (fixedEntry) {
          button.disabled = true;
          saveSeatName(button, number, fixedEntry);
          button.setAttribute('aria-description', '이름이 고정된 ' + seatLabel);
          return;
        }
        button.setAttribute('aria-description', '이름 입력 화면을 새 창으로 열기');
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => {
          selectedButton?.setAttribute('aria-pressed', 'false');
          selectedButton = button;
          button.setAttribute('aria-pressed', 'true');
          activeEditor?.popup.close();
          activeEditor = undefined;
          const popup = window.open(editorUrl.href, '_blank');
          if (popup && !popup.closed) {
            activeEditor = { popup, button, number, label };
            popup.focus();
            return;
          }

          const pageTitle = document.title;
          const editor = fallback ??= seatNameForm(entry => {
            const seat = editor.seat;
            saveSeatName(seat.button, seat.number, entry);
            editor.dialog.close();
          }, () => editor.dialog.close());
          editor.seat = { button, number };
          editor.dialog.addEventListener('close', () => { document.title = pageTitle; }, { once: true });
          editor.load(label, memorial, entries.get(number));
          editor.open();
        });
      });
    }

    const seatRows = 4;
    const seatsPerSide = 2;
    const chairImages = {
      church: './assets/church/chair.webp',
      cathedral: './assets/cathedral/leather-chair.webp',
    };

    function buildSeating(plan, chairImage) {
      const seatType = chairImage ? '의자' : '좌복';
      const seatCount = seatRows * seatsPerSide * 2;
      plan.style.setProperty('--seat-rows', seatRows);
      plan.style.setProperty('--seats-per-side', seatsPerSide);
      plan.setAttribute('aria-label',
        `중앙 통로 양쪽에 ${seatType} ${seatsPerSide}개씩, ${seatRows}줄로 배치된 자리 ${seatCount}개`);
      const aisle = document.createElement('div');
      aisle.className = 'paired-aisle';
      aisle.setAttribute('aria-hidden', 'true');
      const rows = Array.from({ length: seatRows }, () => {
        const row = document.createElement('div');
        row.className = 'paired-row';
        for (let index = 0; index < seatsPerSide * 2; index++) {
          const seat = document.createElement('button');
          seat.type = 'button';
          seat.className = chairImage ? 'chair-name-button' : 'temple-cushion';
          if (index === seatsPerSide) seat.classList.add('first-seat-right');
          if (chairImage) {
            const chair = new Image(160, 160);
            chair.src = chairImage;
            chair.alt = '';
            chair.className = 'upholstered-chair';
            seat.append(chair);
          }
          row.append(seat);
        }
        return row;
      });
      plan.replaceChildren(aisle, ...rows);
      return seatCount;
    }

    function openTempleHall(hall, interior) {
      const view = interior.querySelector('.space-gallery');
      const image = new Image();
      image.src = './assets/temple/' + hall.image;
      image.alt = hall.alt;
      view.replaceWith(image);
      const section = image.parentElement;
      section.classList.add('temple-view');
      section.querySelector('#view-title').hidden = true;
    }

    const params = new URLSearchParams(location.search);
    const space = params.get('space');
    const hallId = params.get('hall') || 'daeungjeon';
    const hall = space === 'temple' && Object.hasOwn(templeHalls, hallId) ? templeHalls[hallId] : null;
    const spaces = new Map([['church', '교회'], ['cathedral', '성당']]);
    const name = hall?.name ?? spaces.get(space);
    if (params.get('seat-entry') === '1') {
      openSeatEntryPage();
    } else if (name) {
      document.title = name + ' | NOW Mind Search';
      document.querySelector('#space-intro').hidden = true;
      const interior = document.querySelector('#space-interior');
      interior.setAttribute('aria-label', name + ' 내부');
      const seating = interior.querySelector('.seating');
      seating.classList.add('furnished-seating', space + '-seating');
      const plan = seating.querySelector('.seating-plan');
      interior.querySelector('.seat-capacity').textContent = buildSeating(plan, chairImages[space]);
      if (hall) {
        interior.querySelector('.seat-guide-item').textContent = '좌복';
        seating.setAttribute('aria-label', '수행 공간');
        plan.style.setProperty('--cushion-color', hall.color);
        openTempleHall(hall, interior);
        const memorial = hallId === 'muryangsujeon' || hallId === 'jijangjeon';
        enableSeatNames(plan, '좌복', memorial, fixedSeatsByHall.get(hallId));
        const tracks = hallChants[hallId];
        if (tracks) addHallChants(interior, tracks);
        const backLink = seating.querySelector('.home-return');
        backLink.href = './temple.html?v=shared-fixed-seats';
        backLink.textContent = '각 전각으로 돌아가기';
      } else {
        enableSeatNames(plan, '좌석', false, sharedFixedSeats);
        startGallery(space);
        if (space === 'church') {
          addHallChants(interior, [['amen', '아멘']], './assets/church/chant/');
        } else if (space === 'cathedral') {
          addHallChants(interior, [['ave-maria', '아베마리아']], './assets/cathedral/chant/');
        }
      }
      interior.hidden = false;
    }
  </script>
</body>
</html>
