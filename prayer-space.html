<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기도 공간 | Mind Search</title>
  <style>
    body { margin: 0; background: #fcedf0; color: #263d36; font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: auto; padding: 40px 20px; }
    a { color: #355a48; }
    .interior:not([hidden]) {
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      height: 100vh;
      height: 100dvh;
      max-width: none;
      padding: 0;
    }
    .interior section { display: grid; place-items: center; }
    .interior section + section { border-top: 1px solid #b8949f; }
    .interior h2 { margin: 0; font-size: clamp(24px, 6vw, 36px); }
    .interior .seating { min-height: 0; border-top: 1px solid #b8949f; background: #f5e8d5; }
    .seating-plan {
      position: relative;
      display: grid;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(4px, 1.2vh, 12px);
      width: min(100%, 460px);
      height: 100%;
      box-sizing: border-box;
      padding: clamp(8px, 2vh, 22px) 6%;
    }
    .aisle {
      position: absolute;
      inset: 0 38%;
      border-inline: 3px double #dcb979;
      background:
        repeating-linear-gradient(45deg, transparent 0 13px, #dcb97945 13px 14px, transparent 14px 26px),
        repeating-linear-gradient(-45deg, transparent 0 13px, #dcb97945 13px 14px, transparent 14px 26px),
        #85394d;
      box-shadow: 0 0 0 2px #6d2638;
    }
    .seat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 2.1fr 1fr 1fr;
      gap: clamp(5px, 2vw, 14px);
      align-items: center;
      justify-items: center;
      min-height: 0;
    }
    .chair {
      width: min(100%, 52px);
      height: min(100%, 36px);
      box-sizing: border-box;
      border: 2px solid #75462f;
      border-top: 5px solid #75462f;
      border-radius: 6px 6px 10px 10px;
      background: linear-gradient(#ce9c70, #b97d53);
      box-shadow: inset 0 0 0 2px #edc398, 0 2px 2px #75462f38;
    }
    .chair:nth-child(3) { grid-column: 4; }
  </style>
</head>
<body>
  <main id="space-intro">
    <h1 id="space-title">기도 공간</h1>
    <p id="space-status" hidden>이 공간은 준비 중이에요.</p>
    <a href="./prayer.html">공간 선택으로 돌아가기</a>
  </main>
  <main id="space-interior" class="interior" hidden>
    <section aria-labelledby="view-title">
      <h2 id="view-title">전경</h2>
    </section>
    <section class="seating" aria-label="좌석">
      <div class="seating-plan" role="img" aria-label="중앙 카펫 통로 양쪽에 의자 두 개씩, 다섯 줄로 배치된 좌석 20개">
        <div class="aisle" aria-hidden="true"></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
      </div>
    </section>
  </main>
  <script>
    const spaces = new Map([['temple', '사찰'], ['church', '교회'], ['cathedral', '성당']]);
    const space = new URLSearchParams(location.search).get('space');
    const name = spaces.get(space);
    if (name) {
      document.querySelector('#space-title').textContent = name;
      document.querySelector('#space-status').hidden = false;
      document.title = name + ' | Mind Search';
      if (space === 'church' || space === 'cathedral') {
        document.querySelector('#space-intro').hidden = true;
        const interior = document.querySelector('#space-interior');
        interior.setAttribute('aria-label', name + ' 내부');
        interior.hidden = false;
      }
    }
  </script>
</body>
</html>
