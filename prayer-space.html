<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기도 공간 | Mind Search</title>
  <style>
    body { margin: 0; background: #fcedf0; color: #263d36; font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: auto; padding: 40px 20px; }
    a { color: #355a48; }
    .interior:not([hidden]) {
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      height: 100vh;
      height: 100dvh;
      max-width: none;
      padding: 0;
    }
    .interior section { display: grid; place-items: center; }
    .interior section + section { border-top: 1px solid #b8949f; }
    .interior h2 { margin: 0; font-size: clamp(24px, 6vw, 36px); }
    .interior .seating { min-height: 0; border-top: 1px solid #b8949f; background: #f5e8d5; }
    .seating-plan {
      position: relative;
      display: grid;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(4px, 1.2vh, 12px);
      width: min(100%, 460px);
      height: 100%;
      box-sizing: border-box;
      padding: clamp(8px, 2vh, 22px) 6%;
    }
    .aisle {
      position: absolute;
      inset: 0 38%;
      border-inline: 3px double #dcb979;
      background:
        repeating-linear-gradient(45deg, transparent 0 13px, #dcb97945 13px 14px, transparent 14px 26px),
        repeating-linear-gradient(-45deg, transparent 0 13px, #dcb97945 13px 14px, transparent 14px 26px),
        #85394d;
      box-shadow: 0 0 0 2px #6d2638;
    }
    .seat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 2.1fr 1fr 1fr;
      gap: clamp(5px, 2vw, 14px);
      align-items: center;
      justify-items: center;
      min-height: 0;
    }
    .chair {
      width: min(100%, 52px);
      height: min(100%, 36px);
      box-sizing: border-box;
      border: 2px solid #75462f;
      border-top: 5px solid #75462f;
      border-radius: 6px 6px 10px 10px;
      background: linear-gradient(#ce9c70, #b97d53);
      box-shadow: inset 0 0 0 2px #edc398, 0 2px 2px #75462f38;
    }
    .chair:nth-child(3) { grid-column: 4; }
    .space-gallery {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2f2118;
    }
    .space-gallery img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .space-gallery button {
      position: absolute;
      right: 12px;
      bottom: 12px;
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #fff9;
      border-radius: 22px;
      background: #21160de0;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .space-gallery button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .interior .furnished-seating {
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .home-return {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      box-sizing: border-box;
      margin: 6px 12px max(8px, env(safe-area-inset-bottom));
      padding: 6px 14px;
      border-radius: 22px;
      background: #355a48;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .home-return:focus-visible { outline: 2px solid #263d36; outline-offset: 2px; }
    .interior .church-seating {
      background: #ecdbba url("./assets/church/marble-floor.webp") center / 360px 360px repeat;
    }
    .furnished-seating .seating-plan {
      grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.8fr) repeat(3, minmax(0, 1fr));
      gap: clamp(3px, 1.1vw, 8px);
      width: min(100%, 560px);
      padding: clamp(6px, 1.3dvh, 12px) clamp(8px, 3vw, 22px);
    }
    .furnished-seating .aisle {
      position: static;
      grid-column: 4;
      grid-row: 1 / -1;
      background: none;
      border: 0;
      box-shadow: none;
    }
    .interior .cathedral-seating {
      background: #ecdbba url("./assets/church/marble-floor.webp") center / 360px 360px repeat;
    }
    .cathedral-seating .paired-aisle {
      background: #641b29 url("./assets/cathedral/runner.webp") center / 100% 100% no-repeat;
      box-shadow: 0 1px 4px #37130e50;
    }
    .furnished-seating .seat-row { display: contents; }
    .upholstered-chair {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      transform: rotate(180deg);
    }
    .upholstered-chair:nth-child(4) { grid-column: 5; }
    @media (max-height: 600px) and (orientation: landscape) {
      .interior:not([hidden]) { grid-template-rows: minmax(0, 1fr); }
      .interior .seating { display: none; }
    }
    .temple-view {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #35231a;
    }
    .temple-view img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .interior .temple-seating {
      background:
        repeating-linear-gradient(90deg, #52301c22 0 1px, transparent 1px 66px),
        linear-gradient(135deg, #b98754, #7d4e2e);
    }
    .furnished-seating .paired-plan {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: clamp(4px, 1dvh, 10px);
      width: min(100%, 440px);
      padding: clamp(8px, 1.8dvh, 16px) 0;
    }
    .paired-aisle {
      position: absolute;
      inset: 0 41%;
    }
    .temple-seating .paired-aisle {
      background: #f6cf8833;
      border-inline: 1px solid #69432255;
    }
    .paired-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) 18% repeat(2, minmax(0, 1fr));
      width: 100%;
      place-items: center;
      min-height: 0;
      container-type: size;
    }
    .paired-row > :nth-child(3) { grid-column: 4; }
    .paired-row .upholstered-chair {
      width: min(84%, 88px);
      height: 90%;
    }
    .temple-cushion[type="button"] { padding: 0; cursor: pointer; }
    .temple-cushion[aria-pressed="true"] { outline: 3px solid #ffe19a; outline-offset: 2px; }
    .temple-cushion:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .temple-cushion {
      width: min(78%, 94px, 110cqh);
      aspect-ratio: 1.45;
      box-sizing: border-box;
      border: 1px solid #40281c;
      border-radius: 18%;
      background: var(--cushion-color);
      box-shadow: inset 0 0 0 2px #e5b07966, inset 0 4px 12px #fff2, 0 2px 3px #41241480;
    }
    .interior.with-chant:not([hidden]) {
      grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
    }
    .hall-chant {
      min-width: 0;
      padding: 6px 10px;
      background: #f6efe2;
      color: #30251b;
      font: 600 14px/1.3 system-ui, sans-serif;
      text-align: center;
    }
    .hall-chant strong { display: block; margin-bottom: 4px; }
    .chant-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .chant-controls button {
      min-height: 44px;
      padding: 4px 10px;
      border: 1px solid #355a48;
      border-radius: 12px;
      background: #fff9e9;
      color: #274637;
      font: inherit;
      cursor: pointer;
    }
    .chant-controls button[aria-pressed="true"] { background: #355a48; color: #fff; }
    .chant-controls button:focus-visible { outline: 2px solid #986538; outline-offset: 2px; }
    .chant-status:not(:empty) { display: block; margin-top: 4px; }
    @media (max-height: 600px) and (orientation: landscape) {
      .interior.with-chant:not([hidden]) { grid-template-rows: minmax(0, 1fr) auto; }
    }
    .cushion-dialog {
      box-sizing: border-box;
      width: min(420px, calc(100% - 32px));
      padding: 22px;
      border: 1px solid #ccb48e;
      border-radius: 16px;
      background: #fff9ed;
      color: #30251b;
    }
    .cushion-dialog::backdrop { background: #251a14a8; }
    .cushion-dialog h2 { margin: 0 0 14px; }
    .cushion-dialog form { display: grid; gap: 8px; }
    .cushion-dialog input {
      box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 10px;
      border: 1px solid #89715b; border-radius: 8px; font: inherit;
    }
    .cushion-dialog p { margin: 0; font-size: 14px; }
    .cushion-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .cushion-actions button {
      min-height: 44px; padding: 6px 12px; border: 1px solid #355a48;
      border-radius: 10px; background: #fff9ed; color: #355a48; font: inherit;
    }
    .cushion-actions button[type="submit"] { background: #355a48; color: #fff; }
  </style>
</head>
<body>
  <main id="space-intro">
    <h1 id="space-title">기도 공간</h1>
    <p id="space-status" hidden>이 공간은 준비 중이에요.</p>
    <a href="./prayer.html">공간 선택으로 돌아가기</a>
  </main>
  <main id="space-interior" class="interior" hidden>
    <section aria-label="전경">
      <h2 id="view-title">전경</h2>
      <div class="space-gallery" hidden>
        <button type="button">일시정지</button>
      </div>
    </section>
    <div class="hall-chant" role="group" aria-labelledby="chant-heading" hidden>
      <strong id="chant-heading">NOW 마음챙김 · 정근</strong>
      <div class="chant-controls"></div>
      <span class="chant-status" role="status"></span>
      <audio loop preload="none"></audio>
    </div>
    <section class="seating" aria-label="좌석">
      <div class="seating-plan" role="img" aria-label="중앙 카펫 통로 양쪽에 의자 두 개씩, 다섯 줄로 배치된 좌석 20개">
        <div class="aisle" aria-hidden="true"></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
      </div>
      <a class="home-return" href="./prayer.html?v=cathedralreturn">기도공간으로 돌아가기</a>
    </section>
  </main>
    <template id="church-seating-template">
      <div class="seating-plan paired-plan" role="img" aria-label="중앙 통로 양쪽에 의자 두 개씩, 네 줄로 배치된 교회 좌석 16개">
        <div class="paired-aisle" aria-hidden="true"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
      </div>
    </template>
    <template id="cathedral-seating-template">
      <div class="seating-plan paired-plan" role="img" aria-label="중앙 버건디 카펫 통로 양쪽에 원목 가죽 의자 두 개씩, 네 줄로 배치된 좌석 16개">
        <div class="paired-aisle" aria-hidden="true"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"></div>
        <div class="paired-row"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"><img class="upholstered-chair" src="./assets/cathedral/leather-chair.webp" alt="" width="160" height="160"></div>
      </div>
    </template>
  <dialog class="cushion-dialog" aria-labelledby="cushion-title">
    <h2 id="cushion-title">좌복 이름 입력</h2>
    <form method="dialog">
      <label for="cushion-name">출생연도와 이름</label>
      <input id="cushion-name" type="text" placeholder="1971년생 김완호" aria-describedby="cushion-name-help"
        maxlength="60" pattern="[0-9]{4}년생\s+.*\S.*" required autofocus>
      <p id="cushion-name-help">예시 1971년생 김완호</p>
      <div class="cushion-actions">
        <button type="button">닫기</button>
        <button type="submit" value="confirm">확인</button>
      </div>
    </form>
  </dialog>
  <script>
    const galleryCaptions = {
      cathedral: [
        '아침빛이 드는 중앙 통로와 제단',
        '십자가와 흰 돌 제단',
        '보석빛 스테인드글라스 장미창',
        '스테인드글라스 빛이 비치는 측랑',
        '성모상과 촛불이 있는 소성당',
        '측면에서 바라본 제단',
        '고딕 천장 아치와 기둥',
        '파이프오르간과 성가대석',
        '노을빛이 비치는 중앙 통로',
        '촛불로 밝혀진 저녁 제단',
      ],
      church: [
        '아침빛이 드는 교회 중앙 통로',
        '나무 십자가와 강단',
        '창가에서 바라본 예배당',
        '강단에 펼쳐진 성경',
        '피아노가 있는 예배당 앞자리',
        '예배당 천장과 나무 들보',
        '강단에서 바라본 예배당 좌석',
        '빗방울 맺힌 창가의 성경',
        '노을이 비치는 예배당 통로',
        '저녁빛 아래의 십자가와 강단',
      ],
    };

    function startGallery(space) {
      const captions = galleryCaptions[space];
      const frames = captions.map((caption, index) => {
        const frame = new Image();
        frame.src = './assets/' + space + '/' + String(index + 1).padStart(2, '0') + '.webp';
        frame.alt = caption;
        return frame;
      });
      const title = document.querySelector('#view-title');
      const gallery = document.querySelector('.space-gallery');
      const toggle = gallery.querySelector('button');
      let index = 0;
      let timer = null;
      gallery.prepend(frames[index]);
      gallery.hidden = false;
      title.hidden = true;
      const play = () => {
        timer = window.setInterval(() => {
          const next = (index + 1) % frames.length;
          if (!frames[next].complete || !frames[next].naturalWidth) return;
          frames[index].replaceWith(frames[next]);
          index = next;
        }, 6000);
        toggle.textContent = '일시정지';
      };
      toggle.addEventListener('click', () => {
        if (timer === null) {
          play();
        } else {
          window.clearInterval(timer);
          timer = null;
          toggle.textContent = '재생';
        }
      });
      play();
    }

    const templeHalls = {
      daejeokgwangjeon: { name: '대적광전', alt: '금빛 비로자나불과 푸른 단청이 보이는 대적광전', image: 'daejeokgwangjeon.webp', color: '#316661' },
      daeungjeon: { name: '대웅전', alt: '단청과 연등 사이로 금빛 석가모니불이 보이는 대웅전', image: 'hall.webp', color: '#893d31' },
      muryangsujeon: { name: '무량수전', alt: '아미타불과 따뜻한 목조 기둥이 보이는 무량수전', image: 'muryangsujeon.webp', color: '#98612a' },
      gwaneumjeon: { name: '관음전', alt: '흰 옷을 입은 관세음보살이 보이는 관음전', image: 'gwaneumjeon.webp', color: '#507968' },
      jijangjeon: { name: '지장전', alt: '보주와 석장을 지닌 지장보살이 보이는 지장전', image: 'jijangjeon.webp', color: '#48496e' },
      samseonggak: { name: '삼성각', alt: '왼쪽부터 산신·칠성·독성이 모셔진 삼성각', image: 'samseonggak.webp', color: '#714339' },
    };

    const hallChants = {
      "daejeokgwangjeon": [
        [
          "om-nam",
          "옴남"
        ]
      ],
      "daeungjeon": [
        [
          "shakyamuni",
          "석가모니불"
        ]
      ],
      "muryangsujeon": [
        [
          "amitabha",
          "나무아미타불"
        ]
      ],
      "gwaneumjeon": [
        [
          "avalokiteshvara",
          "관세음보살"
        ],
        [
          "mani",
          "옴마니반메홈"
        ]
      ],
      "jijangjeon": [["jijang", "지장보살"]],
      "samseonggak": [
        [
          "sansin",
          "산왕대신"
        ],
        [
          "chilseong",
          "칠원성군"
        ],
        [
          "dokseong",
          "나반존자"
        ]
      ]
    };

    function addHallChants(interior, tracks) {
      const panel = interior.querySelector('.hall-chant');
      const controls = panel.querySelector('.chant-controls');
      const status = panel.querySelector('.chant-status');
      const audio = panel.querySelector('audio');
      let selected = null;
      let attempt = 0;
      const buttons = tracks.map(([id, label]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '▶ ' + label;
        button.setAttribute('aria-label', label + ' 정근 재생 또는 일시정지');
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', async () => {
          const currentAttempt = ++attempt;
          status.textContent = '';
          if (selected === id && !audio.paused) {
            audio.pause();
            return;
          }
          if (selected !== id || audio.error) {
            selected = id;
            audio.src = './assets/temple/chant/' + id + '.mp3';
          }
          try {
            await audio.play();
          } catch {
            if (currentAttempt === attempt) status.textContent = '음성을 재생할 수 없어요. 다시 눌러 주세요.';
          }
        });
        return { id, label, button };
      });
      const updateButtons = () => {
        for (const { id, label, button } of buttons) {
          const playing = selected === id && !audio.paused && !audio.error;
          button.textContent = (playing ? '⏸ ' : '▶ ') + label;
          button.setAttribute('aria-pressed', String(playing));
        }
      };
      for (const event of ['play', 'pause', 'error']) audio.addEventListener(event, updateButtons);
      window.addEventListener('pagehide', () => audio.pause());
      controls.replaceChildren(...buttons.map(({ button }) => button));
      panel.hidden = false;
      interior.classList.add('with-chant');
    }

    function openTempleHall(hall, interior, seating, selectable) {
      seating.setAttribute('aria-label', '수행 공간');
      const plan = seating.querySelector('.seating-plan');
      plan.classList.add('paired-plan');
      if (selectable) plan.setAttribute('role', 'group');
      let selectedCushion = null;
      let openNameDialog;
      if (selectable) {
        const dialog = document.querySelector('.cushion-dialog');
        const title = dialog.querySelector('h2');
        const input = dialog.querySelector('input');
        const entries = new Map();
        let cushionNumber;
        dialog.querySelector('button[type="button"]').addEventListener('click', () => dialog.close());
        dialog.querySelector('form').addEventListener('submit', () => {
          entries.set(cushionNumber, input.value.trim());
        });
        openNameDialog = (number) => {
          cushionNumber = number;
          title.textContent = '좌복 ' + number + '번 이름 입력';
          input.value = entries.get(number) ?? '';
          dialog.showModal();
        };
      }
      plan.style.setProperty('--cushion-color', hall.color);
      plan.setAttribute('aria-label', '중앙 통로 양쪽에 좌복 두 개씩, 네 줄로 배치된 수행 자리 16개');
      const aisle = document.createElement('div');
      aisle.className = 'paired-aisle';
      aisle.setAttribute('aria-hidden', 'true');
      const rows = Array.from({ length: 4 }, (_, rowIndex) => {
        const row = document.createElement('div');
        row.className = 'paired-row';
        for (let index = 0; index < 4; index++) {
          const cushion = document.createElement(selectable ? 'button' : 'span');
          cushion.className = 'temple-cushion';
          if (selectable) {
            cushion.type = 'button';
            const number = rowIndex * 4 + index + 1;
            cushion.setAttribute('aria-label', '좌복 ' + number + '번');
            cushion.setAttribute('aria-haspopup', 'dialog');
            cushion.setAttribute('aria-pressed', 'false');
            cushion.addEventListener('click', () => {
              selectedCushion?.setAttribute('aria-pressed', 'false');
              selectedCushion = cushion;
              cushion.setAttribute('aria-pressed', 'true');
              openNameDialog(number);
            });
          }
          row.append(cushion);
        }
        return row;
      });
      plan.replaceChildren(aisle, ...rows);
      const view = interior.querySelector('.space-gallery');
      const image = new Image();
      image.src = './assets/temple/' + hall.image;
      image.alt = hall.alt;
      view.replaceWith(image);
      const section = image.parentElement;
      section.classList.add('temple-view');
      section.querySelector('#view-title').hidden = true;
    }

    const params = new URLSearchParams(location.search);
    const space = params.get('space');
    const hallId = params.get('hall') || 'daeungjeon';
    const hall = space === 'temple' && Object.hasOwn(templeHalls, hallId) ? templeHalls[hallId] : null;
    const spaces = new Map([['church', '교회'], ['cathedral', '성당']]);
    const name = hall?.name ?? spaces.get(space);
    if (name) {
      document.title = name + ' | Mind Search';
      document.querySelector('#space-intro').hidden = true;
      const interior = document.querySelector('#space-interior');
      interior.setAttribute('aria-label', name + ' 내부');
      const seating = interior.querySelector('.seating');
      seating.classList.add('furnished-seating', space + '-seating');
      if (hall) {
        openTempleHall(hall, interior, seating, hallId === 'daejeokgwangjeon');
        const tracks = hallChants[hallId];
        if (tracks) addHallChants(interior, tracks);
        const backLink = seating.querySelector('.home-return');
        backLink.href = './temple.html?v=cushionname';
        backLink.textContent = '각 전각으로 돌아가기';
      } else {
        const template = document.getElementById(space + '-seating-template');
        seating.querySelector('.seating-plan').replaceWith(template.content.cloneNode(true));
        startGallery(space);
      }
      interior.hidden = false;
    }
  </script>
</body>
</html>
