<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기도 공간 | Mind Search</title>
  <style>
    body { margin: 0; background: #fcedf0; color: #263d36; font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: auto; padding: 40px 20px; }
    a { color: #355a48; }
    .interior:not([hidden]) {
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      height: 100vh;
      height: 100dvh;
      max-width: none;
      padding: 0;
    }
    .interior section { display: grid; place-items: center; }
    .interior section + section { border-top: 1px solid #b8949f; }
    .interior h2 { margin: 0; font-size: clamp(24px, 6vw, 36px); }
    .interior .seating { min-height: 0; border-top: 1px solid #b8949f; background: #f5e8d5; }
    .seating-plan {
      position: relative;
      display: grid;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(4px, 1.2vh, 12px);
      width: min(100%, 460px);
      height: 100%;
      box-sizing: border-box;
      padding: clamp(8px, 2vh, 22px) 6%;
    }
    .aisle {
      position: absolute;
      inset: 0 38%;
      border-inline: 3px double #dcb979;
      background:
        repeating-linear-gradient(45deg, transparent 0 13px, #dcb97945 13px 14px, transparent 14px 26px),
        repeating-linear-gradient(-45deg, transparent 0 13px, #dcb97945 13px 14px, transparent 14px 26px),
        #85394d;
      box-shadow: 0 0 0 2px #6d2638;
    }
    .seat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 2.1fr 1fr 1fr;
      gap: clamp(5px, 2vw, 14px);
      align-items: center;
      justify-items: center;
      min-height: 0;
    }
    .chair {
      width: min(100%, 52px);
      height: min(100%, 36px);
      box-sizing: border-box;
      border: 2px solid #75462f;
      border-top: 5px solid #75462f;
      border-radius: 6px 6px 10px 10px;
      background: linear-gradient(#ce9c70, #b97d53);
      box-shadow: inset 0 0 0 2px #edc398, 0 2px 2px #75462f38;
    }
    .chair:nth-child(3) { grid-column: 4; }
    .space-gallery {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2f2118;
    }
    .space-gallery img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .space-gallery button {
      position: absolute;
      right: 12px;
      bottom: 12px;
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #fff9;
      border-radius: 22px;
      background: #21160de0;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .space-gallery button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .interior .church-seating {
      background: repeating-linear-gradient(90deg, #eee1ce 0 1px, transparent 1px 72px),
        linear-gradient(120deg, #f9efe1, #eadac3);
    }
    .church-seating .seating-plan {
      grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.8fr) repeat(3, minmax(0, 1fr));
      gap: clamp(3px, 1.1vw, 8px);
      width: min(100%, 560px);
      padding: clamp(6px, 1.3dvh, 12px) clamp(8px, 3vw, 22px);
    }
    .church-seating .aisle {
      background: #b89973 url("./assets/church/01.webp") center bottom / auto 270% no-repeat;
      border: 0;
      box-shadow: 0 0 0 1px #98775245;
      position: relative;
      inset: auto;
      grid-column: 4;
      grid-row: 1 / -1;
      margin-block: calc(-1 * clamp(6px, 1.3dvh, 12px));
    }
    .church-seating .seat-row { display: contents; }
    .church-chair {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      transform: rotate(180deg);
    }
    .church-chair:nth-child(4) { grid-column: 5; }
  </style>
</head>
<body>
  <main id="space-intro">
    <h1 id="space-title">기도 공간</h1>
    <p id="space-status" hidden>이 공간은 준비 중이에요.</p>
    <a href="./prayer.html">공간 선택으로 돌아가기</a>
  </main>
  <main id="space-interior" class="interior" hidden>
    <section aria-label="전경">
      <h2 id="view-title">전경</h2>
      <div class="space-gallery" hidden>
        <button type="button">일시정지</button>
      </div>
    </section>
    <section class="seating" aria-label="좌석">
      <div class="seating-plan" role="img" aria-label="중앙 카펫 통로 양쪽에 의자 두 개씩, 다섯 줄로 배치된 좌석 20개">
        <div class="aisle" aria-hidden="true"></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
        <div class="seat-row"><span class="chair"></span><span class="chair"></span><span class="chair"></span><span class="chair"></span></div>
      </div>
    </section>
  </main>
    <template id="church-seating-template">
      <div class="seating-plan" role="img" aria-label="중앙 석재 통로 양쪽에 참나무 의자 세 개씩, 다섯 줄로 배치된 좌석 30개">
        <div class="aisle" aria-hidden="true"></div>
        <div class="seat-row"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="seat-row"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="seat-row"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="seat-row"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
        <div class="seat-row"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"><img class="church-chair" src="./assets/church/chair.webp" alt="" width="160" height="160"></div>
      </div>
    </template>
  <script>
    const galleryCaptions = {
      cathedral: [
        '아침빛이 드는 중앙 통로와 제단',
        '십자가와 흰 돌 제단',
        '보석빛 스테인드글라스 장미창',
        '스테인드글라스 빛이 비치는 측랑',
        '성모상과 촛불이 있는 소성당',
        '측면에서 바라본 제단',
        '고딕 천장 아치와 기둥',
        '파이프오르간과 성가대석',
        '노을빛이 비치는 중앙 통로',
        '촛불로 밝혀진 저녁 제단',
      ],
      church: [
        '아침빛이 드는 교회 중앙 통로',
        '나무 십자가와 강단',
        '창가에서 바라본 예배당',
        '강단에 펼쳐진 성경',
        '피아노가 있는 예배당 앞자리',
        '예배당 천장과 나무 들보',
        '강단에서 바라본 예배당 좌석',
        '빗방울 맺힌 창가의 성경',
        '노을이 비치는 예배당 통로',
        '저녁빛 아래의 십자가와 강단',
      ],
    };

    function startGallery(space) {
      const captions = galleryCaptions[space];
      const frames = captions.map((caption, index) => {
        const frame = new Image();
        frame.src = './assets/' + space + '/' + String(index + 1).padStart(2, '0') + '.webp';
        frame.alt = caption;
        return frame;
      });
      const title = document.querySelector('#view-title');
      const gallery = document.querySelector('.space-gallery');
      const toggle = gallery.querySelector('button');
      let index = 0;
      let timer = null;
      gallery.prepend(frames[index]);
      gallery.hidden = false;
      title.hidden = true;
      const play = () => {
        timer = window.setInterval(() => {
          const next = (index + 1) % frames.length;
          if (!frames[next].complete || !frames[next].naturalWidth) return;
          frames[index].replaceWith(frames[next]);
          index = next;
        }, 6000);
        toggle.textContent = '일시정지';
      };
      toggle.addEventListener('click', () => {
        if (timer === null) {
          play();
        } else {
          window.clearInterval(timer);
          timer = null;
          toggle.textContent = '재생';
        }
      });
      play();
    }

    const spaces = new Map([['temple', '사찰'], ['church', '교회'], ['cathedral', '성당']]);
    const space = new URLSearchParams(location.search).get('space');
    const name = spaces.get(space);
    if (name) {
      document.querySelector('#space-title').textContent = name;
      document.querySelector('#space-status').hidden = false;
      document.title = name + ' | Mind Search';
      if (space === 'church' || space === 'cathedral') {
        document.querySelector('#space-intro').hidden = true;
        const interior = document.querySelector('#space-interior');
        interior.setAttribute('aria-label', name + ' 내부');
        interior.hidden = false;
        if (space === 'church') {
          const seating = interior.querySelector('.seating');
          seating.classList.add('church-seating');
          seating.replaceChildren(document.querySelector('#church-seating-template').content.cloneNode(true));
        }
        startGallery(space);
      }
    }
  </script>
</body>
</html>
