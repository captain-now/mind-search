name: AI Heogongjang Daily YouTube Short
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 19:00 Asia/Seoul (KST)
permissions:
  contents: read
concurrency:
  group: ai-heogongjang-daily-short
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PUBLISH_YOUTUBE: ${{ vars.ENABLE_SHORTS_PUBLISH }}
      ENABLE_PORTRAIT_MOTION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless requests edge-tts google-api-python-client google-auth
      - name: Generate and optionally publish
        run: python tools/shorts/produce.py
      - name: Preserve outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heogongjang-short-${{ github.run_id }}
          path: tools/shorts/output/
          if-no-files-found: ignore
          retention-days: 14
