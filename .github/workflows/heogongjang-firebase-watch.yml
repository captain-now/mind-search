name: Heogongjang Firebase official release watch
on:
  schedule:
    - cron: '18 18 * * *' # 03:18 Asia/Seoul
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check official Firebase JS SDK releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, datetime, os, subprocess, re, sys
          # Only actionable release notices, not generic changes or speculative risks.
          url='https://api.github.com/repos/firebase/firebase-js-sdk/releases?per_page=15'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'Heogongjang-FirebaseWatch'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r: releases=json.load(r)
          except Exception as e:
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(f'Firebase official release fetch failed: {e}\n')
            sys.exit(1)
          now=datetime.datetime.now(datetime.timezone.utc)
          terms=re.compile(r'\b(security|vulnerabilit\w*|CVE-\d+|critical|breaking change|deprecat\w*|end.of.support)\b',re.I)
          matches=[]
          for item in releases:
            published=item.get('published_at')
            if not published: continue
            dt=datetime.datetime.fromisoformat(published.replace('Z','+00:00'))
            if now-dt>datetime.timedelta(days=8): continue
            body=item.get('body') or ''
            lines=[line.strip() for line in body.splitlines() if terms.search(line)]
            if lines: matches.append((item,lines[:6]))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('# Firebase official release watch\n\n')
            f.write(f'Checked {len(releases)} recent Firebase JS SDK releases; actionable keyword matches: {len(matches)}.\n')
            f.write('Scope: release-note screening only; does not validate deployed Firebase rules, Google Cloud advisories, or applicability.\n')
          for item,lines in matches:
            title='[Firebase 확인 필요] '+item.get('tag_name','unknown')
            report='공식 Firebase JS SDK 릴리스에서 확인이 필요한 표현이 발견되었습니다. 실제 사이트 영향은 미확인입니다.\n\n'+item.get('html_url','')+'\n\n'+'\n'.join('- '+s[:350] for s in lines)
            q=subprocess.run(['gh','issue','list','--repo',os.environ['GH_REPO'],'--state','all','--search',title,'--json','title'],capture_output=True,text=True)
            existing=json.loads(q.stdout or '[]') if q.returncode==0 else []
            if not any(x.get('title')==title for x in existing):
              subprocess.run(['gh','issue','create','--repo',os.environ['GH_REPO'],'--title',title,'--body',report],check=True)
          PY
