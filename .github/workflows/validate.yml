name: Validate mind search
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free smoke tests
        run: node --test tests/smoke.test.cjs
