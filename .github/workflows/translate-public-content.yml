name: Translate public content into 8 languages
on:
  push:
    branches: [main]
    paths:
      - 'daily-quote.json'
      - 'heogongjang-posts.json'
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
permissions:
  contents: write
concurrency:
  group: translate-public-content
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate missing public text
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python scripts/translate_public_content.py
      - name: Commit translated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-quote.json heogongjang-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-translate new public writings and daily quote"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
