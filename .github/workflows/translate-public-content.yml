name: Translate public writings
on:
  push:
    branches: [main]
    paths: [daily-quote.json, heogongjang-posts.json]
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-translation
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate missing public content
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python scripts/translate_public_content.py
      - name: Commit translations only
        run: |
          git add daily-quote.json heogongjang-posts.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: fill missing public translations'
            git push
          fi
