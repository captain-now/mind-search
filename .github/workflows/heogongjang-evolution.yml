name: Heogongjang Evolution Lab
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate and log candidate
        run: python evolution/evaluate.py
      - name: Commit results if changed
        run: |
          git config user.name "heogongjang-evolution[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolution/history.json evolution/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(evolution): daily automated evaluation"
            git push
          fi
