name: AI Heogongjang Humanity Essay 90s Video
on:
  workflow_dispatch:
    inputs:
      story_path:
        description: 'Repository-relative JSON path with title, ko, en'
        required: true
        default: 'tools/shorts/stories/civilization.json'
permissions:
  contents: read
concurrency:
  group: humanity-essay-video
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HEOGONGJANG_IMAGE_MODEL: gpt-image-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow requests openai
      - name: Check story and API secret
        env:
          STORY_PATH: ${{ inputs.story_path }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo 'Missing OPENAI_API_KEY secret' && exit 1)
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ['STORY_PATH'])
          root=pathlib.Path.cwd().resolve()
          if not path.is_file() or not path.resolve().is_relative_to(root):
              raise SystemExit('Story file must exist inside repository')
          story=json.loads(path.read_text(encoding='utf-8'))
          if not all(isinstance(story.get(k),str) and story[k].strip() for k in ('title','ko','en')):
              raise SystemExit('Story must contain full title, ko and en')
          print('Story validated:',story['title'])
          PY
      - name: Create 15 new scenes, verify and render MP4
        env:
          STORY_PATH: ${{ inputs.story_path }}
        run: |
          python tools/shorts/humanity_essay_video.py \
            --story "$STORY_PATH" \
            --images-dir tools/shorts/output/humanity_${{ github.run_id }}/images \
            --output-dir tools/shorts/output/humanity_${{ github.run_id }} \
            --generate-images
      - name: Save results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanity-essay-90s-${{ github.run_id }}
          path: tools/shorts/output/humanity_${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
