      margin-inline: auto;
      padding: var(--vertical-padding) clamp(24px, 8vw, 52px);
    }
    @supports (height: 100svh) {
      .spaces {
        --viewport-height: 100svh;
        --vertical-padding: clamp(12px, 4svh, 32px);
        --row-gap: clamp(8px, 2.5svh, 22px);
      }
    }
    .space, .prayer-return {
      width: min(100%, calc((var(--viewport-height) - 2 * var(--vertical-padding) - 3 * var(--row-gap) - var(--return-height)) / 2));
    }
    .space {
      /* At 3:2, three card heights add up to twice one card width. */
      aspect-ratio: 3 / 2;
      display: block;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 4px 16px #65384626;
    }
    .space img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .prayer-return {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--return-height);
      padding: 6px 10px;
      border-radius: 12px;
      background: #355a48;
      color: #fff;
      font: 700 14px/1.2 system-ui, sans-serif;
      text-align: center;
      text-decoration: none;
    }
    .prayer-return:focus-visible,
    .space:focus-visible { outline: 3px solid #477866; outline-offset: 4px; }
  </style>
</head>
