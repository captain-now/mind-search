<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>mind search 운영자 관리실</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203b32;background:#f5f8f4}body{margin:0}main{max-width:820px;margin:32px auto;padding:0 16px}h1{font-size:1.5rem}.panel{background:white;border:1px solid #cad9ce;border-radius:16px;padding:20px;margin:16px 0}.field{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #a4b8a8;border-radius:9px;margin:8px 0 14px;font:inherit}button{background:#3d745d;color:white;border:0;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer;margin:4px}button:disabled{opacity:.55}button.danger{background:#9d3737}.muted{color:#5e7268}article{border-top:1px solid #d9e2db;padding:14px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;color:#61736b;margin:5px 0}[hidden]{display:none!important}</style></head>
<body><main><a href="./board.html">← 게시판 돌아가기</a><h1>운영자 신고 관리실</h1><p class="muted">운영자 코드 인증 후 신고 및 계정 삭제 신청을 관리할 수 있습니다.</p>
<section class="panel" id="login"><h2>운영자 코드 로그인</h2><p class="muted">영문·숫자·특수문자를 혼합한 12자리 운영자 코드를 입력하세요.</p><form id="loginForm"><label>운영자 코드<input id="adminCode" class="field" type="password" minlength="12" maxlength="12" autocomplete="off" spellcheck="false" required></label><div id="adminCaptcha" style="margin:12px 0"></div><button type="submit">관리실 입장</button></form><p class="muted">코드는 서버에서 확인하며 5회 실패 시 15분간 제한됩니다.</p></section>
<section class="panel" id="dashboard" hidden><button id="refresh" type="button">신고 새로고침</button><button id="logout" type="button">로그아웃</button><details class="panel"><summary style="cursor:pointer;font-weight:700">운영자 비밀번호 변경</summary><p class="muted">현재 코드 확인 후 새 12자리 코드를 설정합니다. 영문·숫자·특수문자를 모두 포함해야 합니다.</p><form id="changeCodeForm"><label>현재 코드<input id="currentAdminCode" class="field" type="password" minlength="12" maxlength="12" autocomplete="off" required></label><label>새 코드<input id="newAdminCode" class="field" type="password" minlength="12" maxlength="12" autocomplete="new-password" required></label><label>새 코드 확인<input id="confirmAdminCode" class="field" type="password" minlength="12" maxlength="12" autocomplete="new-password" required></label><button type="submit">비밀번호 변경</button><p id="changeCodeStatus" role="status" aria-live="polite" style="font-weight:700;white-space:pre-wrap"></p></form></details><h2>계정 삭제 신청</h2><div id="deletionRequests"></div><h2>신고 목록</h2><div id="reports"></div></section><p id="status" role="status" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js" defer></script>
<script src="./admin-board.js?v=1.12" defer></script></body></html>
