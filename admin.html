<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>mind search 운영자 신고 관리실</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203b32;background:#f5f8f4}body{margin:0}main{max-width:820px;margin:32px auto;padding:0 16px}h1{font-size:1.5rem}.panel{background:white;border:1px solid #cad9ce;border-radius:16px;padding:20px;margin:16px 0}.field{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #a4b8a8;border-radius:9px;margin:8px 0 14px;font:inherit}button{background:#3d745d;color:white;border:0;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer;margin:4px}button:disabled{opacity:.55}button.danger{background:#9d3737}.muted{color:#5e7268}article{border-top:1px solid #d9e2db;padding:14px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;color:#61736b;margin:5px 0}[hidden]{display:none!important}</style></head>
<body><main><a href="./board.html">← 게시판 돌아가기</a><h1>운영자 신고 관리실</h1><p class="muted">운영자로 등록된 이메일 계정만 접근할 수 있습니다. 일반 게시판의 익명 닉네임은 운영자 권한과 무관합니다.</p>
<section class="panel" id="login"><h2>운영자 이메일 인증</h2><p>비밀번호 없이 등록된 운영자 이메일로 로그인 링크를 받습니다.</p><form id="loginForm"><label>운영자 이메일<input id="email" class="field" type="email" autocomplete="email" required></label><div id="captcha"></div><button type="submit">로그인 링크 보내기</button></form><p class="muted">메일의 로그인 링크는 이 관리실로 돌아옵니다. 받은 메일을 다른 사람에게 전달하지 마세요.</p></section>
<section class="panel" id="dashboard" hidden><button id="refresh" type="button">신고 새로고침</button><button id="logout" type="button">로그아웃</button><h2>신고 목록</h2><div id="reports"></div></section><p id="status" role="status" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js" defer></script>
<script src="./admin-board.js?v=2.1.0-rc1" defer></script></body></html>
