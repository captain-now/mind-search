<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOW 길드</title><style>body{margin:0;background:#f3f7f3;color:#244638;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 18px}header{display:flex;align-items:center;justify-content:space-between}a{color:#27684e}.card{background:white;border:1px solid #d8e5da;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #1232}h1{margin:15px 0 4px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #bacfc1;margin:6px 0}button{background:#346d53;color:white;border:0;cursor:pointer}.muted{color:#65786d;font-size:14px}.post{border-top:1px solid #e3ebe4;padding:13px 0;white-space:pre-wrap;overflow-wrap:anywhere}.post b{display:block;margin-bottom:5px}</style></head><body><div class="wrap"><header><strong>🌿 NOW 길드</strong><a href="./">← 홈페이지</a></header><h1>NOW 길드</h1><p>마음을 나누고 함께 성장하는 공간</p><section class="card"><h2>길드 이야기</h2><p>서로 존중하며 마음챙김과 삶의 이야기를 나눕니다.</p><p class="muted">이 페이지의 글은 현재 작성한 기기에만 저장됩니다. 다른 회원과 공유되는 실시간 게시판은 아래에서 이용하세요.</p><a href="./chat.html">💬 실시간 게시판으로 이동 ↗</a></section><section class="card"><h2>나의 길드 기록</h2><input id="nick" maxlength="30" placeholder="닉네임" aria-label="닉네임"><textarea id="msg" rows="4" maxlength="1000" placeholder="오늘의 마음을 기록해 보세요" aria-label="기록"></textarea><button id="save">기록 남기기</button><div id="posts"></div></section></div><script>const key="now-guild-personal-v1";const $=id=>document.getElementById(id);function render(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}$("posts").replaceChildren();a.forEach(p=>{let d=document.createElement("div");d.className="post";let b=document.createElement("b");b.textContent=p.nick+" · "+p.date;let t=document.createElement("span");t.textContent=p.msg;d.append(b,t);$("posts").append(d)})}$("save").onclick=()=>{let nick=$("nick").value.trim(),msg=$("msg").value.trim();if(!nick||!msg){alert("닉네임과 내용을 입력해 주세요.");return}let a=[];try{a=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}a.unshift({nick,msg,date:new Date().toLocaleString()});try{localStorage.setItem(key,JSON.stringify(a.slice(0,100)))}catch(e){alert("저장 공간을 확인해 주세요.");return}$("msg").value="";render()};render();</script></body></html>
