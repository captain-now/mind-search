<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#477866"><title>Mind Search | 실시간 마음 대화방</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ee;color:#284b40;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:#477866}.wrap{max-width:760px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:23px;margin:10px 0}.card{background:#fff;border:1px solid #dbe4dc;border-radius:20px;padding:18px;box-shadow:0 5px 20px #1c4b3610}.muted{color:#617568;font-size:13px;line-height:1.6}.field{width:100%;padding:12px;border:1px solid #b5cabc;border-radius:12px;background:#fff}.btn{background:#477866;color:white;border:0;border-radius:12px;padding:12px 17px;font-weight:700}.btn:disabled{opacity:.55;cursor:wait}.messages{height:min(56vh,520px);min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 0}.bubble{max-width:90%;align-self:flex-start;background:#f0f5ef;border-radius:14px;padding:10px 13px;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#d9eee0}.meta{font-size:11px;color:#607568;margin-bottom:5px}.compose{display:flex;gap:8px}.compose input{flex:1;min-width:0}.hidden{display:none!important}#status{min-height:22px}#captcha{margin:12px 0} .notice{background:#eaf3ec;border:1px solid #a9c9b5;border-radius:14px;padding:15px 17px;margin:16px 0;line-height:1.7}.notice strong{display:block;margin-bottom:5px}.notice a{font-weight:750;text-underline-offset:3px} .danger{border:0;background:transparent;color:#9d3b3b;font-size:12px;padding:4px}
</style></head><body><main class="wrap"><div class="head"><h1>💬 Mind Search 마음 대화방</h1><a href="./index.html">← 홈으로</a></div><p class="muted">공개 채팅방입니다. 모든 참여자가 메시지와 닉네임을 볼 수 있습니다. 개인정보를 올리지 말고 서로 존중해 주세요.</p><aside class="notice" id="nicknameNotice" role="note"><strong>📢 채팅방 이용 안내</strong><b>게시판에 고유 닉네임이 없는 분만</b> 먼저 등록해 주세요. 이미 등록한 분은 자동으로 입장합니다. 게시판과 채팅방은 같은 닉네임을 사용합니다.<div><a href="./board.html">게시판에서 닉네임 등록하기 →</a></div></aside><section class="card"><p id="status" class="muted" role="status" aria-live="polite">연결 준비 중...</p><div id="join"><p class="muted">게시판의 고유 닉네임으로 자동 입장합니다.</p></div><div id="room" class="hidden"><div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div><form id="compose" class="compose"><input class="field" id="message" maxlength="500" placeholder="메시지 입력 (최대 500자)" aria-label="메시지" required><button class="btn" id="send" type="submit">보내기</button></form><p class="muted">메시지 간 최소 5초 · 시간당 최대 60개 · 본인 메시지는 삭제할 수 있습니다.</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script src="./chat.js?v=0.3"></script></body></html>
