<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>곡현하트 · NOW Mind Search</title><style>*{box-sizing:border-box}body{margin:0;background:#f4faf7;color:#164e3b;font:16px system-ui,sans-serif}header{background:#08634f;color:white;padding:20px}header a{color:white}main{max-width:760px;margin:auto;padding:16px}h1{margin:12px 0}#player{aspect-ratio:16/9;background:#142b29;border-radius:14px;overflow:hidden}video,iframe{width:100%;height:100%;border:0}button{font:inherit;color:inherit;background:white;border:1px solid #b8d5c8;border-radius:12px;padding:16px;text-align:left;width:100%;cursor:pointer}button[aria-current=true]{background:#d9efe3;border-color:#08785b}#list{display:grid;gap:10px}a{color:#08634f}footer{margin-top:24px;font-size:14px}</style></head><body><header><a href="./index.html">← NOW Mind Search</a><h1>♥ 곡현하트</h1>음악과 영상으로 함께하는 마음</header><main><div id="player"></div><h2 id="title"></h2><p id="status" role="status"></p><h2>영상 목록</h2><div id="list"></div><footer><a href="https://github.com/captain-now/mind-search/edit/main/heart-videos.json" target="_blank" rel="noopener noreferrer">관리자 영상 목록 편집 (GitHub)</a><p>NOW Mind Search</p></footer></main><script>
const player=document.getElementById('player'),list=document.getElementById('list'),status=document.getElementById('status'),title=document.getElementById('title');
function youtubeId(raw){try{const u=new URL(raw);let id;if(u.hostname==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.match(/^\/(shorts|embed|live)\/([^/]+)/)?.[2];return /^[\w-]{11}$/.test(id||'')?id:null}catch{return null}}
function select(v,b){player.replaceChildren();title.textContent=v.title;status.textContent='';for(const x of list.children)x.setAttribute('aria-current',String(x===b));let el;if(v.type==='youtube'){const id=youtubeId(v.url);if(!id){status.textContent='유튜브 주소를 확인해 주세요.';return}el=document.createElement('iframe');el.src='https://www.youtube-nocookie.com/embed/'+id;el.title=v.title;el.allow='encrypted-media; picture-in-picture; fullscreen';el.allowFullscreen=true;const a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+id;a.target='_blank';a.rel='noopener noreferrer';a.textContent='유튜브에서 보기';status.append(a)}else if(v.type==='mp4'){const u=new URL(v.url,location.href);if(u.origin!==location.origin||!u.pathname.toLowerCase().endsWith('.mp4')){status.textContent='영상 주소를 확인해 주세요.';return}el=document.createElement('video');el.src=u.href;el.controls=true;el.playsInline=true;el.preload='metadata';el.onerror=()=>status.textContent='영상 파일을 불러오지 못했습니다.'}else{return}player.append(el)}
fetch('./heart-videos.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{if(!Array.isArray(items))throw Error();for(const v of items){if(!v||typeof v.title!=='string'||typeof v.url!=='string'||!['mp4','youtube'].includes(v.type))continue;const b=document.createElement('button');b.textContent='▶ '+v.title;b.onclick=()=>select(v,b);list.append(b)}if(list.firstChild)list.firstChild.click();else {player.hidden=true;status.textContent='등록된 영상이 없습니다.'}}).catch(()=>status.textContent='영상 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
</script></body></html>
