6d7}.prompt .wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:8vw}.prompt h2{margin:8px 0 16px}.prompt p{color:var(--muted)}form{display:grid;gap:12px}form label{display:grid;gap:4px;font-weight:600}textarea{resize:vertical;min-height:140px}form .button{justify-self:start}.quiet{color:var(--muted);font-size:.86rem}.status{min-height:1.4em}footer{background:var(--green);color:#f8f1e4;padding:26px 0}dialog{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:clamp(20px,5vw,46px);width:min(640px,calc(100% - 32px));max-height:88vh}dialog::backdrop{background:#11251ed0}dialog h2{margin:10px 0 14px;font-size:clamp(1.5rem,4vw,2.4rem);overflow-wrap:anywhere}dialog p{white-space:pre-wrap;overflow-wrap:anywhere;margin:15px 0}dialog .controls{justify-content:space-between}.secondary{color:var(--green);background:transparent}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:760px){.wrap{width:calc(100% - 36px)}nav{gap:12px;font-size:.8rem}.bar .wrap{min-height:64px}.hero{grid-template-columns:1fr;min-height:auto}.hero-copy{padding:42px 18px}.hero-image{min-height:280px}.shelf,.prompt .wrap{grid-template-columns:1fr}.section-heading{display:grid}.prompt .wrap{gap:24px}main section{padding:42px 0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<body>
<header class="bar"><div class="wrap"><a class="brand" href="#top"><span aria-hidden="true">✦</span>삶의 도서관</a><nav aria-label="주요 메뉴"><a href="#stories">이야기 읽기</a><a href="#write">내 이야기 쓰기</a></nav></div></header>
<main id="top">
  <section class="hero" aria-labelledby="welcome">
    <div class="hero-copy"><h1 id="welcome">살면서 배운 것을<br>한 편씩.</h1><p>누군가의 삶에서 건져 올린 이야기를 읽고, 내 삶에서 배운 한 가지를 글로 남겨보세요.</p><a class="button" href="#stories">이야기 펼쳐보기 <span aria-hidden="true">&nbsp;↓</span></a></div>
    <div class="hero-image" role="img" aria-label="햇살이 드는 창가에 펼쳐진 오래된 책"></div>
  </section>
  <section class="wrap" id="stories">
    <div class="section-heading"><h2>이야기 서가</h2><div class="controls"><label><span class="sr">이야기 검색</span><input id="search" type="search" placeholder="제목이나 내용으로 검색"></label><label><span class="sr">주제</span><select id="filter"><option value="">모든 주제</option><option>다시 시작</option><option>관계</option><option>일상</option></select></label></div></div>
    <div class="shelf" id="shelf"></div><p id="empty" hidden role="status">찾는 이야기가 없어요. 다른 말로 검색해 보세요.</p>
  </section>
  <section class="prompt" id="write"><div class="wrap">
    <div><h2>나의 이야기 남기기</h2><p>질문 하나를 고르고, 떠오르는 장면부터 적어보세요.</p></div>
    <form id="story-form">
      <label>물음<select id="question"><option value="다시 시작">지금 시작하기엔 늦었다고 느낀 적이 있나요?</option><option value="관계">누군가와의 관계에서 뒤늦게 배운 것은 무엇인가요?</option><option value="일상">평범한 하루를 다르게 보게 된 순간이 있나요?</option></select></label>
      <label>제목<input id="entry-title" maxlength="80" required></label>
      <label>이야기<textarea id="entry-body" maxlength="6000" required></textarea></label>
      <p class="quiet">저장한 글은 이 브라우저의 서가에서만 볼 수 있어요.</p>
      <button class="button" type="submit">내 서가에 저장</button><p class="status" id="feedback" role="status"></p>
    </form>
  </div></section>
</main>
<footer><div class="wrap">삶의 도서관 · 허공장</div></footer>
<dialog id="reader" aria-labelledby="reader-title">
  <div class="controls"><span class="tag" id="reader-tag"></span><form method="dialog"><button class="button secondary">닫기</button></form></div>
  <h2 id="reader-title"></h2><div id="reader-content"></div>
  <div class="controls" id="reader-actions" hidden><button id="edit" class="button secondary" type="button">수정하기</button><button id="remove" class="button secondary" type="button">지우기</button></div>
</dialog>
<script>
'use strict';
const stories=[
 {topic:'다시 시작',title:'서툰 채로 시작해도',body:'처음에는 잘할 수 있는지부터 알고 싶었다. 그러다 첫날에는 단 한 줄만 써 보기로 했다. 둘째 날에 그 줄을 지우고 다시 썼다.\n\n나중에 돌아보니 자신감이 생기기 전에 손을 먼저 움직인 날들이 있었다. 처음으로 돌아갈 수 있다면, 그날의 나에게 한 줄이면 충분하다고 말해주고 싶다.'},
 {topic:'관계',title:'대답을 조금 늦추는 일',body:'친구가 힘들었던 하루를 이야기했다. 예전 같으면 어떻게 하면 좋을지부터 말했겠지만, 그날은 먼저 무슨 일이 더 있었는지 물었다.\n\n친구는 말을 마치고 한숨을 쉬었다. 내가 기억하는 건 내가 해 준 말보다, 친구가 자기 속도로 끝까지 이야기할 수 있었던 그 저녁이다.'},
 {topic:'일상',title:'늘 지나치던 창가',body:'매일 같은 길을 다녔는데, 한 번은 신호를 놓쳐 창가 앞에 오래 서 있었다. 창 안쪽에 놓인 화분마다 작은 종이가 꽂혀 있었다. 누구에게 받은 것인지 적어둔 이름표였다.\n\n그 뒤로는 신호가 바뀔 때까지 가끔 그 창을 본다. 사소한 것을 눈여겨보는 데도 시간이 필요하다는 걸 그날 알았다.'}
];
const key='life-library-stories-v1';
const byId=id=>document.getElementById(id);
const shelf=byId('shelf'), reader=byId('reader'), form=byId('story-form');
const search=byId('search'), filter=byId('filter'), feedback=byId('feedback');
const question=byId('question'), titleInput=byId('entry-title'), bodyInput=byId('entry-body');
let drafts=[], active, editingId;
try {
  const saved=JSON.parse(localStorage.getItem(key)||'[]');
  if(Array.isArray(saved)) drafts=saved.filter(entry=>entry&&typeof entry.id==='string'&&typeof entry.title==='string'&&typeof entry.body==='string'&&typeof entry.topic==='string');
} catch {}
function save(next) {
  try { localStorage.setItem(key,JSON.stringify(next)); }
  catch { feedback.textContent='저장 공간을 사용할 수 없어요. 글을 따로 복사해 두고 다시 시도해 주세요.';return false; }
  drafts=next;
  return true;
}
function node(tag,text,style) {
  const element=document.createElement(tag);
  element.textContent=text;
  if(style) element.className=style;
  return element;
}
function render() {
  const term=search.value.trim().toLowerCase();
  const visible=[...drafts,...stories].filter(entry=>(!filter.value||entry.topic===filter.value)&&[entry.title,entry.body,entry.topic].join(' ').toLowerCase().includes(term));
  shelf.replaceChildren();
  for(const entry of visible) {
    const card=node('article','','card');
    const preview=entry.body.split(/\n/)[0];
    const open=node('button','펼쳐 읽기 →');
    open.type='button';
    open.setAttribute('aria-label',entry.title+' 펼쳐 읽기');
    open.onclick=()=>read(entry);
    card.append(node('div',entry.topic+' · '+(entry.id?'내 이야기':'예시 글'),'tag'),node('h3',entry.title),node('p',preview.length>90?preview.slice(0,90)+'…':preview),open);
    shelf.append(card);
  }
  byId('empty').hidden=visible.length>0;
}
function read(entry) {
  active=entry;
  byId('reader-tag').textContent=entry.topic+' · '+(entry.id?'내 이야기':'예시 글');
  byId('reader-title').textContent=entry.title;
  byId('reader-content').replaceChildren(...entry.body.split(/\n\n+/).map(part=>node('p',part)));
  byId('reader-actions').hidden=!entry.id;
  reader.showModal();
}
search.addEventListener('input',render);
filter.addEventListener('change',render);
form.addEventListener('submit',event=>{
  event.preventDefault();
  const title=titleInput.value.trim(),body=bodyInput.value.trim();
  if(!title||!body){feedback.textContent='제목과 이야기를 적어주세요.';return;}
  const item={id:editingId||crypto.randomUUID(),topic:question.value,title,body};
  const next=editingId?drafts.map(entry=>entry.id===editingId?item:entry):[item,...drafts];
  if(!save(next))return;
  editingId=null;
  form.reset();
  form.querySelector('[type=submit]').textContent='내 서가에 저장';
  feedback.textContent='이야기를 내 서가에 저장했어요.';
  search.value='';
  filter.value='';
  render();
});
byId('edit').onclick=()=>{
  editingId=active.id;
  question.value=active.topic;
  titleInput.value=active.title;
  bodyInput.value=active.body;
  form.querySelector('[type=submit]').textContent='수정 내용 저장';
  feedback.textContent='';
  reader.close();
  titleInput.focus();
};
byId('remove').onclick=()=>{
  if(!confirm('이 브라우저에서 이 이야기를 지울까요?'))return;
  if(!save(drafts.filter(entry=>entry.id!==active.id))){reader.close();feedback.scrollIntoView();return;}
  if(editingId===active.id){editingId=null;form.reset();form.querySelector('[type=submit]').textContent='내 서가에 저장';}
  reader.close();
  render();
  feedback.textContent='이야기를 지웠어요.';
};
render();
</script>
</body>
</html>
